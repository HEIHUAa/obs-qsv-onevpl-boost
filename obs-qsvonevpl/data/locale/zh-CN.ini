TargetUsage="目标使用"
TargetUsageDesc="控制编码速度与压缩效率之间的权衡。TU1（最慢）提供最佳压缩和质量，但编码速度最慢。TU7（最快）编码速度最快，但相同质量下文件体积更大。"
Bitrate="码率"
BitrateDesc="目标码率（Kbps）。编码器会尽量维持此平均码率输出。数值越高画质越好，但需要更大带宽。"
CustomBufferSize="自定义 VBV 缓冲区"
CustomBufferSizeDesc="启用后可自定义 VBV（视频缓冲校验器）缓冲区大小，而非使用驱动默认值。"
BufferSize="VBV 缓冲区大小 (KB)"
BufferSizeDesc="VBV 缓冲区大小（KB）。决定编码器可使用的码率波动范围。更大的缓冲区能平滑码率尖峰，提高整体质量，但会增加延迟。"
MaxBitrate="最高码率"
MaxBitrateDesc="最高码率（Kbps）。限制码率峰值。仅适用于 VBR（可变码率）和 VCM 码率控制模式。"
Profile="配置文件"
ProfileDesc="编码档次定义了编码功能和特性集。更高档次提供更好的压缩和额外功能，但需要更强大的解码器硬件支持。"
Tier="层级"
TierDesc="HEVC 层级决定最大码率和压缩能力。Main 层级针对大多数应用场景，High 层级允许更高码率以适应高要求场景。"
Level="等级"
LevelDesc="编码等级定义了分辨率、帧率和码率约束。自动根据编码参数选择适当的等级。"
RateControl="速率控制"
RateControlDesc="选择码率控制算法。CBR：恒定码率，适合直播等带宽可预测场景。VBR：可变码率，码率分配更灵活。CQP：恒定量化参数，基于质量编码。AVBR：自适应VBR。ICQ：智能恒定质量。VCM：可变复杂度模式。QVBR：质量定义的VBR。"
ICQQuality="ICQ 质量"
ICQQualityDesc="智能恒定质量（ICQ）码率控制的质量目标。范围 1-51（VP9 为 1-63）。数值越小视觉质量越好，但码率也越高。"
QVBRQuality="QVBR 质量 (ICQ)"
QVBRQuality.Tooltip="QVBR 码率控制的质量等级，基于 ICQ（智能恒定质量）原理。1=最差，51=最好，0=驱动默认。"
KeyframeIntervalSec="关键帧间隔（0=自动）"
KeyframeIntervalSecDesc="关键帧（I帧）之间的最大间隔（秒）。0 = 自动。较短的间隔有助于搜索和错误恢复，但会降低压缩效率。"
BFrames="B帧"
MBBRC="宏块级码率控制"
NumRefFrame="参考帧数"
NumRefActiveP="P帧参考数"
NumRefActiveBL0="B帧前向参考数"
NumRefActiveBL1="B帧后向参考数"
LookaheadDownSampling="前瞻下采样倍数"
GlobalMotionBiasAdjustment="全局运动偏差调整"
DirectBiasAdjusment="直接偏差调整"
AdaptiveI="自适应 I 帧"
AdaptiveB="自适应 B 帧"
AdaptiveRef="自适应参考帧"
AdaptiveCQM="自适应量化矩阵"
Pyramid="帧金字塔"
Trellis="网格编码优化"
Lookahead_Mode="前瞻模式"
LookaheadDesc="控制前瞻码率控制以改进码率分配。HQ（高质量）对未来帧进行完整分析，深度可配置。LP（低功耗）使用轻量级前瞻，限于B帧深度。OFF 禁用前瞻分析。"
LookaheadDepth="前瞻深度"
MotionVectorsOverpicBoundaries="跨图像边界运动矢量"
UseRawRef="使用原始参考帧"
MVCostScalingFactor="运动矢量成本缩放因子"
RDO="率失真优化"
HRDConformance="HRD 一致性"
LowDelayBRC="低延迟 BRC"
LowDelayBRCDesc="启用后配置码率控制器为低延迟操作，缩短平均窗口。可能导致质量不够稳定，但能减少缓冲延迟。"
LowDelayHRD="低延迟 HRD"
LowDelayHRDDesc="启用后降低 HRD（假设参考解码器）缓冲区大小约束以支持低延迟运行。需要 HRD 一致性设置为 ON 或 AUTO。"
AsyncDepth="异步深度"
AdaptiveLTR="自适应长期参考帧"
SampleAdaptiveOffset="样本自适应偏移（SAO）"
SampleAdaptiveOffsetDesc="样本自适应偏移（SAO）滤波减少 HEVC 解码中的振铃伪影。控制滤波器应用的色彩通道：仅亮度、仅色度或全部。DISABLE 关闭，AUTO 让驱动决定。"
GPB="GPB"
EncTools="编码工具"
EncToolsSceneChange="场景切换检测"
EncToolsSceneChangeDesc="启用编码工具中的场景切换检测。检测到场景切换时，编码器可调整编码参数以维持切换处的质量。"
EncToolsAdaptiveRefP="自适应 P 帧参考选择"
EncToolsAdaptiveRefPDesc="启用 P 帧参考帧的自适应选择，根据内容特征提高编码质量。"
EncToolsAdaptiveRefB="自适应 B 帧参考选择"
EncToolsAdaptiveRefBDesc="启用 B 帧参考帧的自适应选择。B 帧可以从过去和未来的参考帧中选择最佳参考。"
EncToolsAdaptivePyramidQuantP="自适应金字塔量化参数（P帧）"
EncToolsAdaptivePyramidQuantPDesc="根据时域重要性自适应调整金字塔参考结构中 P 帧的量化参数。"
EncToolsAdaptivePyramidQuantB="自适应金字塔量化参数（B帧）"
EncToolsAdaptivePyramidQuantBDesc="根据时域层次级别自适应调整金字塔参考结构中 B 帧的量化参数。"
EncToolsAdaptiveMBQP="自适应宏块量化参数"
EncToolsAdaptiveMBQPDesc="启用宏块级自适应量化，将更多码率分配给复杂区域以提高主观视觉质量。"
EncToolsBRCBufferHints="码率控制缓冲提示"
EncToolsBRCBufferHintsDesc="向码率控制器提供缓冲区占用率提示，实现帧间更平滑的码率分配。"
EncToolsBRC="码率控制优化"
EncToolsBRCDesc="启用编码工具提供的高级码率控制器优化，改进率失真性能。"
EncToolsSaliencyMapHint="显著性图提示"
EncToolsSaliencyMapHintDesc="提供显著性图信息，引导编码器将更多码率分配给视觉上重要的区域。"
LowPower_Mode="低功耗模式"
ScenarioInfo="场景信息"
ContentInfo="内容类型"
TransformSkip="变换跳过"
FadeDetection="淡入淡出检测"
VideoProcessing_Filters="视频处理滤镜"
Denoise_Strength="降噪强度"
Denoise_StrengthDesc="降噪滤波器强度（1-100）。数值越高降噪效果越强，但可能去除细节。仅在降噪模式设置为手动模式时有效。"
Denoise_Mode="降噪模式"
Denoise_ModeDesc="选择降噪滤波器模式和位置。AUTO 让驱动决定。MANUAL 模式允许指定滤镜强度。PRE ENCODE 在编码前滤波，POST ENCODE 对重建帧滤波。"
Scaling_Mode="缩放模式"
Scaling_ModeDesc="编码器需要缩放视频帧时使用的缩放滤波器。QUALITY | ADVANCED 提供最佳质量。LOWPOWER 模式以质量换性能。AUTO 让驱动决定。"
VPPOutWidth="VPP 输出宽度"
VPPOutWidthDesc="缩放时自定义输出宽度（像素）。0 = 使用输入宽度。"
VPPOutHeight="VPP 输出高度"
VPPOutHeightDesc="缩放时自定义输出高度（像素）。0 = 使用输入高度。"
ImageStab_Mode="图像稳定模式"
ImageStab_ModeDesc="启用视频稳定以减少相机抖动。UPSCALE 通过放大可见画面填充边界缺失区域。BOXING 在隐藏区域添加黑边。AUTO 让驱动决定。"
Detail_Enhancement="细节增强"
Detail_EnhancementDesc="启用细节增强滤镜，在编码前锐化和增强视频中的细节。可提高感知锐度，但可能降低编码效率。"
Detail_Factor="细节因子"
Detail_FactorDesc="细节增强滤镜强度（1-100）。数值越高图像越锐利，但可能引入伪影并增加码率。"
PercEncPrefilter="百分比编码预滤波"
PercEncPrefilterDesc="基于百分比的编码预滤波。在编码前对视频帧进行预处理以提高编码效率。有助于减少高运动内容中的伪影。"
IntraRefEncoding="帧内刷新编码"
IntraRefEncodingDesc="帧内刷新将 I 帧数据分布到多个帧中，而非使用单个大型 I 帧。对低延迟应用有用，可保持帧大小一致并减少延迟尖峰。"
IntraRefType="帧内刷新方向"
IntraRefTypeDesc="帧内刷新模式的方向。VERTICAL 从左到右逐列刷新宏块。HORIZONTAL 从上到下逐行刷新宏块。"
IntraRefCycleSize="帧内刷新周期大小"
IntraRefQPDelta="帧内刷新 QP 差值"
Select_GPU="选择 GPU"
Accuracy="精度"
Convergence="收敛性"
Latency="延迟"
SubjectiveVideoEnhancements="主观视频增强"
8bitUnsupportedHdr="OBS不支持Rec. 2100的 8-bit 输出。"
10bitUnsupportedAvc="无法在 Intel QSV H.264 编码器上执行 10-bit 编码。"
NumRefFrame.Tooltip="所有可用参考帧的最大数量（对于 AVC/HEVC，NumRefFrame 定义 DPB 大小）。如果 NumRefFrame = 0，则不指定此参数。"
GOPOptFlag="GOP 状态标志"
GOPOptFlag.Tooltip="CLOSED：\n设置此标志时，编码器生成封闭 GOP。此 GOP 中的帧不使用前一个 GOP 中的帧作为参考。未设置此标志时，编码器生成开放 GOP。显示顺序中 GOP 第一帧之前的帧可能使用前一个 GOP 中的帧作为参考。\nSTRICT：\n编码器必须严格遵循由 GopPicSize、B帧 等参数定义的 GOP 结构。否则，编码器可以调整 GOP 结构以提高效率，其范围受 GopPicSize 和 B帧 等参数的约束。"
GlobalMotionBiasAdjustment.Tooltip="启用全局运动偏差。"
DirectBiasAdjusment.Tooltip="将此标志设置为 ON 以使 ENC 模式决策算法偏向于更少的 B Direct/Skip 类型。仅适用于 B 帧，所有其他帧将忽略此设置。"
AdaptiveI.Tooltip="控制编码器插入 I 帧。"
AdaptiveB.Tooltip="控制帧类型从 B 更改为 P。"
AdaptiveRef.Tooltip="如果此标志设置为 ON，编码器将自适应选择参考帧列表以提高编码质量。\n启用此标志可能会增加计算复杂度和引入额外延迟。"
AdaptiveCQM.Tooltip="如果此标志设置为 ON，编码器将自适应选择实现定义的量化矩阵用于每个帧。非默认量化矩阵旨在在特定条件下提高主观视觉质量。它们的数量和定义特定于 API 实现。如果此标志设置为 OFF，则所有帧使用默认量化矩阵。"
AdaptiveMaxFrameSize="最大帧大小 (bytes)"
ScenarioInfo.Tooltip="指定编码场景以针对预期应用优化编码器设置。"
TransformSkip.Tooltip="启用或禁用变换跳过。启用后，编码器可能跳过某些块的变换步骤以提高压缩效率。"
FadeDetection.Tooltip="指示编码器是否应使用内部淡入淡出检测算法来计算权重/偏移值"
Trellis.Tooltip="控制编码器中的网格编码优化。"
LookaheadDepth.Tooltip="指定前瞻速率控制算法的深度。深度值是编码器在编码前分析的帧数。值范围为 1 到 100（含）。"
MVOverpicBoundaries.Tooltip="设置为 OFF 时，不使用图片边界外的样本，也不使用通过使用一个或多个图片边界外样本推导出其样本值的分数样本位置样本进行任何样本的帧间预测。\n设置为 ON 时，可以在帧间预测中使用一个或多个图片边界外的样本。"
PreferredMode="分区检查启用"
PreferredMode.Tooltip="控制 AVC 编码器尝试从小分区进行预测。"
UseRawRef.Tooltip="将此标志设置为 ON 以使用原始帧而非重建帧作为参考。"
MVCostScalingFactor.Tooltip="0：将 MV 成本设置为 0。\n1：将 MV 成本缩放为默认值的 1/2。\n2：将 MV 成本缩放为默认值的 1/4。\n3：将 MV 成本缩放为默认值的 1/8。"
RDO.Tooltip="率失真优化"
AsyncDepth.Tooltip="指定应用程序在执行显式同步结果之前执行的异步操作数量。"
Latency.Tooltip="延迟和质量之间存在权衡。\n如果您偏好质量，请选择 'normal' 模式，这可能导致超过 2 秒的端到端延迟。\n如果您的应用需要低于 500ms 的端到端延迟，请选择 'ultra-low' 模式。"
EncTools.Tooltip="使用高级编码器功能进行额外的帧处理步骤以提高质量。编码工具使用 CPU 能力处理帧。启用它可能影响编码器的性能和稳定性。"
HEVCGPB.Tooltip="将此参数设置为 OFF 以使 HEVC 编码器使用常规 P 帧而不是 GPB。"
BFramesDesc="I 帧或 P 帧（或 GPB）关键帧之间的 B 帧数量；如果为零，则 GOP 结构未指定。GPB 为 ON 时，使用 GPB 帧（无向后引用的 B 帧）代替 P 帧。"
HRDConformanceDesc="如果此参数设置为 ON，则编码器生成符合 HRD 的码流。如果设置为 OFF，则编码器可能（但不一定）违反 HRD 一致性。"
MBBRCDesc="启用此参数可启用宏块级码率控制，通常可提高主观视觉质量。启用此标志可能对性能和客观视觉质量指标产生负面影响。"
RDODesc="如果需要率失真优化，将此参数设置为 ON。"
AdaptiveIDesc="控制编码器插入 I 帧。将此参数设置为 ON 以允许将帧类型从 P 和 B 更改为 I。"
AdaptiveBDesc="控制帧类型从 B 更改为 P。将此参数设置为 ON 以启用从 B 到 P 的帧类型更改。"
AdaptiveRefDesc="如果此参数设置为 ON，编码器将自适应选择参考帧列表以提高编码质量。"
AdaptiveLTRDesc="如果此参数设置为 ON，编码器将根据编码参数和内容属性标记、修改或删除 LTR 帧。"
AdaptiveCQMDesc="如果此参数设置为 ON，编码器将自适应选择实现定义的量化矩阵用于每个帧。非默认量化矩阵旨在在特定条件下提高主观视觉质量。"
PyramidDesc="启用 P 帧和 B 帧的金字塔参考结构。P 金字塔在 B帧=0 时提高编码效率。B 金字塔将 B 帧排列为层级参考结构。"
UseRawRefDesc="将此参数设置为 ON 以使用原始帧而非重建帧作为参考。"
GlobalMotionBiasDesc="启用全局运动偏差。"
DirectBiasDesc="将此参数设置为 ON 以使 ENC 模式决策算法偏向于更少的 B Direct/Skip 类型。仅适用于 B 帧，所有其他帧将忽略此设置。"
MVOverpicBoundariesDesc="设置为 OFF 时，不使用图片边界外的样本，也不使用通过使用一个或多个图片边界外样本推导出其样本值的分数样本位置样本进行任何样本的帧间预测。设置为 ON 时，可以在帧间预测中使用一个或多个图片边界外的样本。"
TrellisDesc="用于控制编码器中的网格编码优化。"
LookaheadDSDesc="控制前瞻分析时的图像下采样倍数。1X=原始分辨率分析(最慢质量最好)，2X=缩小2倍，4X=缩小4倍(最快但可能降质)。"
1X="1倍(原始分辨率)"
2X="2倍"
4X="4倍"
VPPDesc="用于额外帧处理的滤镜。启用它可能会影响性能。"
LowPowerDesc="提示启用编码器的低功耗模式。Intel Arc 图形适配器仅在启用 LowPower 参数时工作，更改参数状态不会影响操作。集成 Intel UHD 图形可以在两种模式下工作，可用功能可能因参数状态而异。"
IntraRefCycleSizeDesc="指定刷新周期内的图片数量，从 2 开始。0 和 1 是无效值。"
IntraRefQPDeltaDesc="指定插入的帧内宏块的 QP 差值。有符号值范围为 -51 到 51。"
NumRefActivePDesc="指定 P 帧最多能参考多少个已经编码好的画面来预测当前帧。数值越大压缩效果越好，但会增加显卡负担，低端显卡上可能导致丢帧。"
NumRefActiveBL0Desc="指定 B 帧最多能参考多少个已经编码好的过去画面（前向）来预测。数值越大压缩效果越好，但会增加显卡负担，低端显卡上可能导致丢帧。"
NumRefActiveBL1Desc="指定 B 帧最多能参考多少个尚未编码的未来画面（后向）来预测。数值越大压缩效果越好，但会增加显卡负担和延迟，低端显卡上可能导致丢帧。"
ScenarioInfoDesc="指定编码场景以针对预期应用优化编码器设置。"
TransformSkipDesc="启用或禁用变换跳过。启用后，编码器可能跳过某些块的变换步骤以提高压缩效率。"
FadeDetectionDesc="检测淡入淡出场景并调整编码参数。AUTO 让编码器决定何时启用淡入淡出检测。"
ContentInfoDesc="指定内容类型以针对特定视频内容优化编码器设置。选择合适的内容类型可以提高压缩效率。"
GPUNumberDesc="为多 GPU 系统选择图形适配器。您所需的适配器编号可能因系统设置的优先级而异。"

# Screen Content Tools
ScreenContentTools="屏幕内容工具"
ScreenContentTools.Tooltip="针对屏幕内容优化编码（文字、UI元素、滚动）。'自动'仅在受支持的硬件上启用（Lunar Lake+）。"
AUTO_OFF_ON="自动 / 关闭 / 开启"

# Temporal Layers
TemporalLayers="时间层"
TemporalLayers.Tooltip="时间层数量（0=关闭，1-8）。时间层通过创建分层帧结构实现可伸缩视频编码。较高层可以被丢弃以降低码率而无需解码器重置。"
TemporalLayers.Desc="分层 B 帧结构的时间层数量。0 禁用时间分层。"

# Separate I/P/B QP
SeparateIPBQP="分离 I/P/B 量化参数"
SeparateIPBQPDesc="启用后可为 I、P、B 帧分别设置不同的量化参数（QP），对帧间质量分布进行精细控制。"
CQP="恒定量化参数"
CQPDesc="禁用分离 I/P/B QP 时所有帧类型的量化参数。数值越低质量越高但码率也越高。范围 1-51（AVC/HEVC）或 1-63（AV1/VP9）。"
QPI="I帧量化参数"
QPIQPPQPDesc="量化参数值。数值越低画质越好但码率越高。范围 1-51（AVC/HEVC）或 1-63（AV1/VP9）。"
QPP="P帧量化参数"
QPB="B帧量化参数"

