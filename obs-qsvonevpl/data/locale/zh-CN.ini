DebugLogPSNR="输出 PSNR 日志"
DebugLogPSNRDesc="开启后挂载 VPL Encoded Quality Info 扩展，编码器会回传每帧 MSE（Y/U/V）。插件将 luma MSE 换算为 PSNR，并按 I/P/B 帧类型聚合统计，在会话结束时按 QPStats 的格式（count/min/max/avg/median）输出到 OBS 日志。仅支持 H.264——HEVC/AV1/VP9 在 vpl-gpu-rt 中未实现。H.264 还要求 CropW 和 CropH 均为 16 的倍数，因此 1920x1080（CropH=1080）不可用；请改用 1280x720、1920x1088 或 3840x2160。"

MinQP="最小 QP"
MinQPDesc="最小量化参数约束。格式：\n- \"-1\"：驱动默认（不限制）\n- \"12\"：所有帧类型相同 QP\n- \"12,12,12\"：分别设置 I、P、B 帧 QP\n数值自动限制到 51（8-bit）或 51+6*(BitDepth-8)。0 为有效设置。"
MaxQP="最大 QP"
MaxQPDesc="最大量化参数约束。格式同最小 QP。数值自动限制。0 为有效设置。"

