# AV1 AuxData
AV1CDEF="CDEF 滤波"
AV1CDEFDesc="约束方向增强滤波。减少 AV1 编码中边缘周围的振铃伪影。\n影响视觉质量和压缩效率。对 GPU 影响极小。"
AV1Restoration="环路恢复滤波"
AV1RestorationDesc="环路恢复滤波（Wiener/自引导）。恢复丢失的高频细节并减少伪影。\n以轻微编码开销为代价提升感知质量。对 GPU 影响极小。"
AV1LoopFilter="环路滤波"
AV1LoopFilterDesc="去块效应环路滤波控制。减少块边界处的块状伪影。\n关闭可能提高锐度但会引入可见伪影。对 GPU 影响极小。"
AV1SuperRes="超分辨率"
AV1SuperResDesc="AV1 自适应超分辨率。对高细节帧进行降采样再升采样，在低码率下提高编码效率。\n对流媒体场景有用。由于额外的缩放操作，增加 GPU 负载。"
AV1InterpFilter="插值滤波器"
AV1InterpFilterDesc="运动补偿插值滤波器类型。控制子像素运动的插值方式。\nEIGHTTAP_SHARP：保留更多细节，GPU 负载略高。\nBILINEAR：更快但更柔和，GPU 负载更低。"
AV1ErrorResilient="错误弹性模式"
AV1ErrorResilientDesc="错误弹性编码模式。在比特流中插入额外同步点以帮助从数据丢失中恢复。\n对直播有用但可能降低压缩效率。不影响 GPU/CPU 使用率。"
AV1Segmentation="AV1 分段"
AV1SegmentationDesc="启用静态双分段映射的 AV1 分段。画面中心 50% 区域使用分段 1，QP 差值为 -10，以提升焦点区域画质。\n仅适用于 AV1 编码。\n由于分段模式决策，略微增加 GPU 负载。"

# VPP MCTF
VPPMCTF="MCTF（运动补偿时域滤波）"
VPPMCTFDesc="运动补偿时域滤波。通过分析帧间运动减少时域噪声。\n对于有运动内容的视频比空间降噪更有效。\n高强度可能导致运动模糊。增加 GPU 负载。不影响 CPU 使用率。"
VPPMCTFStrength="MCTF 滤波强度"
VPPMCTFStrengthDesc="MCTF 时域滤波强度。范围 0-20。\n较高值提供更强的降噪效果但可能引入运动模糊。\n强度越高，GPU 负载成比例增加。不影响 CPU 使用率。"

# Weighted Prediction
WeightedPred="加权预测"
WeightedPredDesc="P 帧加权预测。允许对参考样本加权以提高淡入淡出场景的预测效率。\n对光照变化的内容可改善压缩效果。对 GPU 影响极小。"
WeightedBiPred="双向加权预测"
WeightedBiPredDesc="B 帧双向加权预测。将加权预测扩展到双向参考。\n对淡入淡出过渡和溶解效果有用。对 GPU 影响极小。"

# Adaptive Max Frame Size
AdaptiveMaxFrameSize="最大帧大小 (bytes)"
AdaptiveMaxFrameSizeDesc="限制最大编码帧大小（字节）。\n0 = 驱动自动选择。设置非零值可防止超大帧。\n超大帧在串流场景中可能导致缓冲下溢。\n不影响 GPU 负载。仅部分码率控制模式支持。"



# Custom Coding Options
CustomCodingOptions="自定义编码选项"
CustomCodingOptionsDesc="允许覆盖 mfxExtCodingOption、mfxExtCodingOption2、mfxExtCodingOption3 和 mfxExtCodingOptionDDI 中的单个字段。每行使用 '作用域.字段名=值' 格式。作用域：CO、CO2、CO3、CODDI。值：ON、OFF 或数字。以 # 或 ; 开头的行将被忽略。示例：\nCO.RateDistortionOpt=ON\nCO2.FixedFrameRate=OFF\nCODDI.Hme=ON\nCODDI.BRCPrecision=3"

# Property Group Names
Group.RateControl="码率控制与质量"
Group.InterFrame="帧间结构"
Group.EncTools="编码工具与优化"
Group.RefMotion="参考帧与运动估计"
Group.VPPFilters="预处理/后处理滤镜"
Group.CodecSpecific="编解码器特定选项"
Group.IntraRefresh="帧内刷新"
Group.Misc="杂项"
Group.Debug="调试"

# Debug group
QPStatistics="QP 统计"
QPStatistics.Tooltip="录制结束时在 OBS 日志中输出每帧 QP 统计（按 I/P/B 帧类型的 min/max/avg/median）。\n纯诊断用途 — 不影响编码或 GPU/CPU 使用率。"
VideoHeaderHexDump="视频头 Hex Dump"
VideoHeaderHexDump.Tooltip="编码器初始化时将 SPS/PPS/VPS 原始字节以十六进制 dump 到 OBS 日志。\n用于调试比特流头部问题。纯诊断用途 — 不影响编码或 GPU/CPU 使用率。"

MinQP="最小 QP"
MinQPDesc="最小量化参数约束。\n格式：\"-1\"（驱动默认）、\"12\"（所有类型相同）、\"12,12,12\"（I,P,B 分别设置）。\n防止 QP 低于指定值，限制最高质量。\n数值自动限制到有效范围。不影响 GPU 负载。"
MaxQP="最大 QP"
MaxQPDesc="最大量化参数约束。格式同最小 QP。\n防止 QP 超过指定值，限制最低质量。\n用于确保基准质量水平。不影响 GPU 负载。"

# ROI (Region of Interest)
ROIEditor="ROI 编码器设置"
ROIEditorDesc="配置感兴趣区域（ROI）编码，为画面不同区域分配不同的码率优先级。\n仅 H.264 和 HEVC 编码器支持。\n不直接影响 GPU/CPU 使用率；编码器根据优先级调整各区域 QP。"
ROIApply="应用"
