TargetUsage="目标使用"
TargetUsageDesc="控制编码速度与压缩效率之间的权衡。\nTU1（最慢）：最佳压缩率和质量，编码最慢，GPU/CPU 负载最高。\nTU7（最快）：编码最快，同质量下文件更大，GPU/CPU 负载最低。\n越低的目标使用，GPU/CPU 负载越高，但每比特质量越好。"
Bitrate="码率"
BitrateDesc="目标码率（Kbps）。编码器会尽量维持此平均码率。\n数值越高画质越好，但需要更大带宽，且由于量化更精细，可能略微增加 GPU 负载。"
CustomBufferSize="自定义 VBV 缓冲区"
CustomBufferSizeDesc="启用后可自定义 VBV（视频缓冲校验器）缓冲区大小。\n更大的缓冲区允许帧间码率波动更大，在复杂场景中提高质量。\n较小的缓冲区减少延迟，但场景切换时可能导致质量下降。"
BufferSize="VBV 缓冲区大小 (KB)"
BufferSizeDesc="VBV 缓冲区大小（KB）。控制帧间码率波动的允许范围。\n更大的缓冲区：复杂场景中画质更好，延迟更高。\n更小的缓冲区：延迟更低，但高运动场景中可能画质下降。"
MaxBitrate="最高码率"
MaxBitrateDesc="最高码率（Kbps）。限制编码器输出的峰值码率。\n仅适用于 VBR 和 VCM 码率控制模式。不影响 GPU 负载。"
Profile="配置文件"
ProfileDesc="定义编码功能和特性集。\n更高档次：更好的压缩和额外功能（如 B 帧、10-bit 支持）。\n需要更强大的解码器硬件。不影响编码器 GPU 负载。"
Tier="层级"
TierDesc="HEVC 层级决定最大码率和压缩约束。\nMain 层级：针对大多数应用，标准码率限制。\nHigh 层级：允许更高码率，适用于高要求场景（4K/8K、高帧率）。\n不影响 GPU 负载。"
Level="等级"
LevelDesc="定义分辨率、帧率和码率约束。\n自动根据当前编码参数选择适当等级。\n错误的等级可能导致某些设备播放异常。不影响 GPU 负载。"
RateControl="速率控制"
RateControlDesc="选择码率控制算法。\nCBR：恒定码率，带宽可预测 — 最适合直播。\nVBR：可变码率，每比特质量更好 — 适合录制。\nCQP：恒定量化参数，基于质量编码 — 忽略码率目标。\nAVBR：自适应 VBR — 平衡质量和码率稳定性。\nICQ：智能恒定质量 — 追求一致的视觉质量。\nVCM：可变复杂度模式 — 根据内容复杂度自适应。\nQVBR：质量定义 VBR — 瞄准特定质量级别。\n码率控制选择不直接影响 GPU 负载。"
ICQQuality="ICQ 质量"
ICQQualityDesc="ICQ（智能恒定质量）码率控制的质量目标。\n范围 1-51（VP9 为 1-63）。数值越小质量越好，码率越高。\n仅在码率控制设为 ICQ 时生效。不影响 GPU 负载。"
QVBRQuality="QVBR 质量 (ICQ)"
QVBRQuality.Tooltip="QVBR 码率控制的质量等级，基于 ICQ（智能恒定质量）原理。\n1=最好，51=最差，0=驱动默认。不影响 GPU 负载。"
KeyframeIntervalSec="关键帧间隔（0=自动）"
KeyframeIntervalSecDesc="关键帧（I帧）之间的最大间隔（秒）。0 = 自动。\n较短间隔：更快跳转、更好的错误恢复，但压缩率降低。\n较长间隔：压缩率更高，但跳转更慢，丢包后伪影更明显。\n关键帧较大，编码时 GPU 处理量更多。"
BFrames="B帧"
MBBRC="宏块级码率控制"
NumRefFrame="参考帧数"
NumRefActiveP="P帧参考数"
NumRefActiveBL0="B帧前向参考数"
NumRefActiveBL1="B帧后向参考数"
LookaheadDownSampling="前瞻下采样倍数"
GlobalMotionBiasAdjustment="全局运动偏差调整"
DirectBiasAdjusment="直接偏差调整"
AdaptiveI="自适应 I 帧"
AdaptiveB="自适应 B 帧"
AdaptiveRef="自适应参考帧"
AdaptiveCQM="自适应量化矩阵"
Pyramid="帧金字塔"
Trellis="网格编码优化"
Lookahead_Mode="前瞻模式"
LookaheadDesc="控制前瞻码率控制以改进码率分配。\nHQ：对未来帧进行完整分析 — 质量最佳，GPU/CPU 负载更高。\nLP：轻量级前瞻，限于 B 帧深度 — 性能均衡。\nOFF：禁用前瞻 — GPU/CPU 负载最低，但码率分布可能不够优化。"
LookaheadDepth="前瞻深度"
MotionVectorsOverpicBoundaries="跨图像边界运动矢量"
UseRawRef="使用原始参考帧"
MVCostScalingFactor="运动矢量成本缩放因子"
RDO="率失真优化"
HRDConformance="HRD 一致性"
LowDelayBRC="低延迟 BRC"
LowDelayBRCDesc="配置码率控制器为低延迟操作。\n缩短码率计算的平均窗口。\n延迟更低，但帧间质量可能不够稳定。\n不影响 GPU 负载。适用于实时交互应用。"
LowDelayHRD="低延迟 HRD"
LowDelayHRDDesc="启用后降低 HRD（假设参考解码器）缓冲区大小约束以支持低延迟运行。需要 HRD 一致性设置为 ON 或 AUTO。"
SkipFrame="跳过帧"
SkipFrameDesc="控制码率控制时的跳帧行为。\nOFF：编码器从不跳过帧。\nON：仅在码率控制需要避免缓冲区溢出时才跳过帧（BRC-only 模式）。\nAUTO：由驱动决定。\n仅适用于 AVC 和 HEVC 编码器。"
AsyncDepth="异步深度"
AdaptiveLTR="自适应长期参考帧"
SampleAdaptiveOffset="样本自适应偏移（SAO）"
SampleAdaptiveOffsetDesc="SAO（样本自适应偏移）滤波减少 HEVC 中的振铃伪影。\n控制滤波器应用的色彩通道。\nLUMA：减少亮度边缘伪影。CHROMA：减少色带。\nALL：亮度和色度均处理。DISABLE：关闭 SAO。对 GPU 影响极小。"
GPB="GPB"
TuneQuality="编码质量调优"
TuneQuality.Tooltip="选择 AV1 编码器针对哪种感知质量目标进行优化。\nOFF：不进行质量调优。\nVMAF/PERCEPTUAL：通过显著性图启用感知编码预过滤（会增加 CPU 负载）。\n仅 AV1 可用，且依赖 ONEVPL_EXPERIMENTAL 实验性 API。"
EncTools="编码工具"
EncToolsSceneChange="场景切换检测"
EncToolsSceneChangeDesc="启用场景切换检测，在过渡处调整编码参数。\n检测场景间的硬切、淡入淡出和溶解效果。\n编码器在场景边界插入 I 帧或调整 QP 以获得更好质量。\n场景过渡时略微增加 CPU 负载。"
EncToolsAdaptiveRefP="自适应 P 帧参考选择"
EncToolsAdaptiveRefPDesc="启用自适应 P 帧参考选择以提高质量。\n编码器分析内容特征选择最佳参考帧。\n提高 P 帧的压缩效率。略微增加 CPU 负载。"
EncToolsAdaptiveRefB="自适应 B 帧参考选择"
EncToolsAdaptiveRefBDesc="启用自适应 B 帧参考选择，可从前后帧中选取最佳参考。\n编码器为每个 B 帧动态选择最佳参考帧。\n提高 B 帧的压缩效率。略微增加 CPU 负载。"
EncToolsAdaptivePyramidQuantP="自适应金字塔量化参数（P帧）"
EncToolsAdaptivePyramidQuantPDesc="根据 P 帧的时域重要性进行自适应量化。\n金字塔层级较高的帧获得更精细的量化（更好质量）。\n提高整体压缩效率。略微增加 CPU 负载。"
EncToolsAdaptivePyramidQuantB="自适应金字塔量化参数（B帧）"
EncToolsAdaptivePyramidQuantBDesc="根据 B 帧的时域层级进行自适应量化。\n高层级 B 帧量化更精细，低层级 B 帧量化更粗糙。\n提高 B 金字塔结构中的率失真性能。略微增加 CPU 负载。"
EncToolsAdaptiveMBQP="自适应宏块量化参数"
EncToolsAdaptiveMBQPDesc="启用帧内宏块级自适应量化。\n为视觉复杂区域分配更多比特，简单区域分配更少比特。\n在相同码率下提高主观视觉质量。\n由于逐宏块分析，增加 CPU 负载。"
EncToolsBRCBufferHints="码率控制缓冲提示"
EncToolsBRCBufferHintsDesc="向码率控制器提供缓冲区占用率提示。\n帮助 BRC 在帧间做出更平滑的码率分配决策。\n减少码率波动，提高质量一致性。\n略微增加 CPU 负载。"
EncToolsBRC="码率控制优化"
EncToolsBRCDesc="通过 EncTools 启用高级码率控制器优化。\n通过更智能的比特分配提高率失真性能。\n可在相同码率下获得更好质量。增加 CPU 负载。"
EncToolsSaliencyMapHint="显著性图提示"
EncToolsSaliencyMapHintDesc="提供视觉显著性图以引导比特分配。\n编码器为视觉重要区域（人脸、文字、运动）分配更多比特。\n提高观众关注区域的主观质量。\n由于显著性分析，增加 CPU 负载。"
LowPower_Mode="低功耗模式"
ScenarioInfo="场景信息"
ContentInfo="内容类型"
TransformSkip="变换跳过"
FadeDetection="淡入淡出检测"
VideoProcessing_Filters="视频处理滤镜"
Denoise_Strength="降噪强度"
Denoise_StrengthDesc="降噪滤波器强度（1-100）。数值越高降噪效果越强，但可能去除细节。\n仅在降噪模式设置为手动模式时有效。\nGPU 负载随强度增加而增加。不影响 CPU 使用率。"
Denoise_Mode="降噪模式"
Denoise_ModeDesc="选择降噪滤波器模式和位置。\nAUTO：驱动决定最佳降噪策略。\nMANUAL：允许指定滤镜强度。\nPRE ENCODE：编码前滤波 — 减少源画面噪声。\nPOST ENCODE：对重建帧滤波 — 减少编码伪影。\n所有模式均增加 GPU 负载。不影响 CPU 使用率。"
Scaling_Mode="缩放模式"
Scaling_ModeDesc="编码器需要缩放视频帧时使用的缩放滤波器。\nQUALITY | ADVANCED：最佳视觉质量，GPU 负载更高。\nLOWPOWER 模式：以质量换性能，GPU 负载更低。\nAUTO：驱动选择最佳模式。\n仅在缩放激活时（输出分辨率与输入不同）影响 GPU 负载。"
VPPOutWidth="VPP 输出宽度"
VPPOutWidthDesc="缩放时自定义输出宽度（像素）。0 = 使用输入宽度。"
VPPOutHeight="VPP 输出高度"
VPPOutHeightDesc="缩放时自定义输出高度（像素）。0 = 使用输入高度。"
ImageStab_Mode="图像稳定模式"
ImageStab_ModeDesc="启用视频稳定以减少相机抖动。\nUPSCALE：通过放大可见画面填充边界缺失区域。\nBOXING：在隐藏区域添加黑边。\nAUTO：驱动决定最佳模式。\n启用时增加 GPU 负载。不影响 CPU 使用率。"
Detail_Enhancement="细节增强"
Detail_EnhancementDesc="启用细节增强滤镜，在编码前锐化和增强视频中的细节。\n可提高感知锐度，但可能降低编码效率。\n增加 GPU 负载。由于锐利帧更难压缩，细节增强也可能增加码率。"
Detail_Factor="细节因子"
Detail_FactorDesc="细节增强滤镜强度（1-100）。数值越高图像越锐利，但可能引入伪影并增加码率。\n强度越高，GPU 负载略微增加。不影响 CPU 使用率。"
PercEncPrefilter="百分比编码预滤波"
PercEncPrefilterDesc="基于百分比的编码预滤波。在编码前对视频帧进行预处理以提高编码效率。\n有助于减少高运动内容中的伪影。\n增加 GPU 负载。不影响 CPU 使用率。"
IntraRefEncoding="帧内刷新编码"
IntraRefEncodingDesc="帧内刷新将 I 帧数据分布到多个帧中，而非使用单个大型 I 帧。\n对低延迟应用有用，可保持帧大小一致并减少延迟尖峰。\n避免完整 I 帧的突发码率峰值，有助于串流稳定性。\n与常规编码相比，不影响 GPU/CPU 使用率。"
IntraRefType="帧内刷新方向"
IntraRefTypeDesc="帧内刷新模式的方向。\nVERTICAL：从左到右逐列刷新宏块。\nHORIZONTAL：从上到下逐行刷新宏块。\n选择影响刷新波的视觉模式，但不影响 GPU/CPU 使用率。"
IntraRefCycleSize="帧内刷新周期大小"
IntraRefQPDelta="帧内刷新 QP 差值"
Select_GPU="选择 GPU"
Accuracy="精度"
Convergence="收敛性"
Latency="延迟"
SubjectiveVideoEnhancements="主观视频增强"
8bitUnsupportedHdr="OBS不支持Rec. 2100的 8-bit 输出。"
10bitUnsupportedAvc="无法在 Intel QSV H.264 编码器上执行 10-bit 编码。"
NumRefFrame.Tooltip="最大参考帧数（定义 AVC/HEVC 的 DPB 大小）。\n数值越高：压缩越好，GPU 内存使用越多。\n0 = 不指定参数，驱动使用默认值。\n不直接影响 GPU 计算负载。"
GOPOptFlag="GOP 状态标志"
GOPOptFlag.Tooltip="CLOSED：编码器生成封闭 GOP — 此 GOP 中的帧不引用前一个 GOP。\n更适合跳转和串流，但压缩率略低。\nSTRICT：编码器必须严格遵循定义的 GOP 结构。\n未设置时，编码器可调整 GOP 结构以提高效率。\n不影响 GPU 负载。"
GlobalMotionBiasAdjustment.Tooltip="启用全局运动偏差调整以优化运动估计。\n帮助编码器检测和补偿全局运动（摄像机平移、缩放、旋转）。\n可改善有摄像机运动场景的压缩效果。对 GPU 影响极小。"
DirectBiasAdjusment.Tooltip="将此标志设置为 ON 以使 ENC 模式决策算法偏向于更少的 B Direct/Skip 类型。\n仅适用于 B 帧，其他帧将忽略此设置。\n可能以略微提高码率为代价改善复杂 B 帧的视觉质量。\n对 GPU 影响极小。"
AdaptiveI.Tooltip="允许编码器根据需要动态插入 I 帧。\n开启后，编码器可能根据内容将 P 或 B 帧改为 I 帧。\n场景切换时改善质量，但可能暂时增加码率。\n对 GPU 负载影响极小。"
AdaptiveB.Tooltip="允许编码器在有益时将 B 帧改为 P 帧。\n开启后，编码器可能用 P 帧替代 B 帧以获得更好的预测效果。\n可在 B 帧预测效果不佳的高运动场景中改善质量。\n对 GPU 负载影响极小。"
AdaptiveRef.Tooltip="如果此标志设置为 ON，编码器将自适应选择参考帧列表以提高编码质量。\n启用此标志可能会增加计算复杂度和引入额外延迟。"
AdaptiveCQM.Tooltip="如果设置为 ON，编码器将自适应选择实现定义的量化矩阵用于每个帧。\n非默认量化矩阵旨在在特定条件下提高主观视觉质量。\n其数量和定义特定于 API 实现。\n如果设置为 OFF，则所有帧使用默认量化矩阵。\n略微增加 GPU/CPU 负载。"
AdaptiveMaxFrameSize="最大帧大小 (bytes)"
ScenarioInfo.Tooltip="指定编码场景以针对预期应用优化编码器设置。\n不同场景（直播、存档、会议）有不同的质量/延迟权衡。\n编码器根据所选场景调整内部参数。\n不直接影响 GPU/CPU 负载。"
TransformSkip.Tooltip="启用某些块的变换跳过模式。\n有益时，编码器跳过 DCT/DST 变换步骤以保留锐利边缘。\n适用于屏幕内容（文字、UI）和具有锐利过渡的图形。\n对自然视频内容可能略微增加码率。对 GPU 影响极小。"
FadeDetection.Tooltip="启用淡入淡出检测以在过渡期间调整编码。\n检测淡入、淡出和交叉淡入淡出效果。\n编码器在淡入淡出期间调整量化和预测权重以获得更好质量。\nAUTO 让编码器决定何时启用。略微增加 CPU 负载。"
Trellis.Tooltip="控制编码器中的网格编码量化。\n网格编码量化通过优化量化决策提高压缩效率。\n提高每比特质量，但显著增加 GPU/CPU 计算开销。\n推荐用于追求质量的编码；性能优先场景建议关闭。"
LookaheadDepth.Tooltip="指定前瞻速率控制算法的深度。\n较高值：编码器分析更多未来帧 — 码率分配更优，GPU/CPU 负载更高。\n较低值：分析更少 — GPU/CPU 负载更低，但码率分布不够优化。\n值范围为 1 到 100（含）。"
MVOverpicBoundaries.Tooltip="控制运动矢量是否可以引用图像边界外的样本。\nOFF：不使用边界外样本 — 标准合规，压缩率较低。\nON：允许使用边界外样本 — 可能改善图像边缘的压缩效果。\n对 GPU 负载影响极小。"
RepartitionCheck="分区检查启用"
RepartitionCheckDesc="控制 AVC 编码器是否尝试从小块分区进行预测。\n启用后，编码器评估更多分区大小以获得更好的压缩效果。\n提高压缩效率，但增加 GPU/CPU 计算量。\n仅适用于 AVC (H.264) 编码。"
UseRawRef.Tooltip="将此标志设置为 ON 以使用原始（未压缩）帧而非重建帧作为参考。\n通过避免有损重建的误差传播来提高质量。\n显著增加 GPU/CPU 内存带宽使用。\n可能与某些编码器功能存在兼容性问题。"
MVCostScalingFactor.Tooltip="缩放模式决策中的运动矢量成本，影响编码器搜索运动矢量的力度。\n较低值降低 MV 成本，鼓励更多运动搜索 — 可能提高质量但增加 GPU/CPU 负载。\n0：MV 成本 = 0（最激进）。\n1：MV 成本 = 默认值的 1/2。\n2：MV 成本 = 默认值的 1/4。\n3：MV 成本 = 默认值的 1/8（最保守，GPU 负载最低）。"
RDO.Tooltip="启用率失真优化进行编码决策。\n编码器评估多种编码模式，选择最佳质量/比特方案。\n显著提高压缩效率，但大幅增加 GPU/CPU 负载。\n推荐用于追求质量的编码；低延迟或性能优先场景建议关闭。"
AsyncDepth.Tooltip="指定编码器在同步前排队的异步操作数量。\n较高值：GPU 利用率和吞吐量更好 — 但内存使用更多。\n较低值：延迟更低、内存更少 — 但可能降低 GPU 利用率。\n大多数场景推荐 4-8。不影响编码质量。"
Latency.Tooltip="延迟和质量之间存在权衡。\nNormal：偏向质量，可能导致超过 2 秒的端到端延迟。\nUltra-low：低于 500ms 端到端延迟，可能降低质量。\n不直接影响 GPU/CPU 使用率。"
EncTools.Tooltip="使用高级编码器功能进行额外帧处理。\nEncTools 使用 CPU 在编码前分析和优化帧。\n提高编码质量和压缩效率。\n显著增加 CPU 使用率；在 CPU 受限系统上可能降低编码吞吐量。\n某些驱动版本下可能影响编码器稳定性。"
HEVCGPB.Tooltip="控制 HEVC 编码器是否使用 GPB（广义 P/B）帧。\nOFF：编码器使用常规 P 帧而非 GPB 帧。\nON：使用 GPB 帧 — 即无后向引用的 B 帧。\nGPB 帧可在保持低延迟的同时提高压缩率。\n对 GPU 负载影响极小。"
BFramesDesc="I/P 关键帧之间的 B 帧数量。0 = 未指定 GOP 结构。\nB 帧通过使用前后双向参考提高压缩效率。\n更多 B 帧：压缩更好，但编码延迟和 GPU 负载更高。\n推荐：在测试场景中，4 个 B 帧可获得最佳压缩效率。\nGPB 开启时，GPB 帧（无后向引用的 B 帧）替代 P 帧。"
HRDConformanceDesc="控制 HRD（假设参考解码器）一致性。\nON：编码器生成严格符合 HRD 的码流 — 某些广播标准需要。\nOFF：编码器可能违反 HRD 约束以获得更好的压缩效果。\n不影响 GPU 负载。开启时可能略微增加码率。"
MBBRCDesc="启用宏块级码率控制以提升主观视觉质量。\n根据内容复杂度在帧内更智能地分配比特。\n会增加 GPU/CPU 负载，可能略微降低客观质量指标（PSNR/SSIM）。"
RDODesc="启用率失真优化进行编码决策。\n编码器评估多种编码模式，选择最佳质量/比特方案。\n显著提高压缩效率，但大幅增加 GPU/CPU 负载。\n推荐用于追求质量的编码；低延迟或性能优先场景建议关闭。"
AdaptiveIDesc="允许编码器根据需要动态插入 I 帧。\n开启后，编码器可能根据内容将 P 或 B 帧改为 I 帧。\n场景切换时改善质量，但可能暂时增加码率。\n对 GPU 负载影响极小。"
AdaptiveBDesc="允许编码器在有益时将 B 帧改为 P 帧。\n开启后，编码器可能用 P 帧替代 B 帧以获得更好的预测效果。\n可在 B 帧预测效果不佳的高运动场景中改善质量。\n对 GPU 负载影响极小。"
AdaptiveRefDesc="启用自适应参考帧选择以提高压缩效果。\n编码器为每个块动态选择最佳参考帧。\n提高编码质量，但增加 GPU/CPU 计算量。\n可能引入额外编码延迟。"
AdaptiveLTRDesc="启用自适应长期参考帧（LTR）管理。\n编码器可根据内容和参数标记、修改或删除 LTR 帧。\nLTR 帧可改善有重复内容或背景的场景质量。\n略微增加 GPU/CPU 负载。"
AdaptiveCQMDesc="启用每帧自适应量化矩阵选择。\n非默认矩阵旨在特定条件下提高主观视觉质量。\n编码器基于内容分析从实现定义的矩阵中选择。\n略微增加 GPU/CPU 负载。"
PyramidDesc="启用 B 帧的层级金字塔参考结构。\nP 金字塔：B帧=0 时提高编码效率。\nB 金字塔：将 B 帧排列为时域层级结构，提高压缩率。\n略微增加 GPU/CPU 负载，但提高压缩效率。"
UseRawRefDesc="使用原始（未压缩）帧而非重建帧作为参考。\n通过避免有损重建的误差传播来提高质量。\n显著增加 GPU/CPU 内存带宽使用。\n可能与某些编码器功能存在兼容性问题。"
GlobalMotionBiasDesc="启用全局运动偏差调整以优化运动估计。\n帮助编码器检测和补偿全局运动（摄像机平移、缩放、旋转）。\n可改善有摄像机运动场景的压缩效率。\n对 GPU 负载影响极小。"
DirectBiasDesc="使模式决策算法偏向于更少的 B Direct/Skip 类型。\n仅适用于 B 帧，其他帧忽略此设置。\n可能以略微提高码率为代价改善复杂 B 帧的视觉质量。\n对 GPU 负载影响极小。"
MVOverpicBoundariesDesc="控制运动矢量是否可以引用图像边界外的样本。\nOFF：不使用边界外样本 — 标准合规，压缩率较低。\nON：允许使用边界外样本 — 可能改善图像边缘的压缩效果。\n对 GPU 负载影响极小。"
TrellisDesc="控制编码器中的网格编码量化。\n网格编码量化通过优化量化决策提高压缩效率。\n提高每比特质量，但显著增加 GPU/CPU 计算开销。\n推荐用于追求质量的编码；性能优先场景建议关闭。"
LookaheadDSDesc="控制前瞻分析时的图像下采样倍数。\n1X：原始分辨率分析 — 质量最佳，GPU/CPU 负载最高。\n2X：一半分辨率 — 质量与性能的良好平衡。\n4X：四分之一分辨率 — 最快，前瞻质量最低。\n仅在启用前瞻模式时生效。"
1X="1倍(原始分辨率)"
2X="2倍"
4X="4倍"
VPPDesc="视频处理管线滤镜，用于额外帧处理。\n启用 VPP 滤镜会在编码前/后增加 GPU 处理步骤。\n每启用一个滤镜都会增加 GPU 负载，可能降低编码吞吐量。\n关闭不用的滤镜以最大化编码性能。"
LowPowerDesc="提示启用编码器的低功耗模式。\nIntel Arc 图形适配器：仅在启用 LowPower 时工作，更改此参数不影响操作。\n集成 Intel UHD 图形：可在两种模式下工作，可用功能可能因参数状态而异。\n在某些硬件上（如 UHD 730），LowPower 模式可能显著降低质量。\nGPU 功耗和时钟频率会相应调整。"
IntraRefCycleSizeDesc="指定刷新周期内的图片数量，从 2 开始。\n决定完成一次完整帧内刷新需要多少帧。\n较大的周期使刷新更渐进，减少每帧的码率影响。\n不影响 GPU/CPU 使用率。0 和 1 是无效值。"
IntraRefQPDeltaDesc="指定刷新行中插入的帧内宏块的 QP 差值。\n负值：刷新块质量更高，但帧大小更大。\n正值：质量更低，帧大小更小。\n有符号值范围为 -51 到 51。不影响 GPU/CPU 使用率。"
NumRefActivePDesc="P 帧可引用的过去帧数量。\n数值越高：压缩越好，但 GPU 内存带宽和负载增加。\n低端显卡上设置过高可能导致丢帧。\n大多数场景推荐 2-4。"
NumRefActiveBL0Desc="B 帧可引用的过去帧数量（前向预测）。\n数值越高：B 帧压缩越好，但 GPU 负载增加。\n低端显卡上设置过高可能导致丢帧。\n大多数场景推荐 2。"
NumRefActiveBL1Desc="B 帧可引用的未来帧数量（后向预测）。\n数值越高：B 帧压缩越好，但编码延迟和 GPU 负载增加。\n低端显卡上设置过高可能导致丢帧。\n大多数场景推荐 1-2。"
ScenarioInfoDesc="指定编码场景以优化编码器设置。\n不同场景（直播、存档、会议）有不同的质量/延迟权衡。\n编码器根据所选场景调整内部参数。\n不直接影响 GPU/CPU 负载。"
TransformSkipDesc="启用某些块的变换跳过模式。\n有益时，编码器跳过 DCT/DST 变换步骤以保留锐利边缘。\n适用于屏幕内容（文字、UI）和具有锐利过渡的图形。\n对自然视频内容可能略微增加码率。对 GPU 影响极小。"
FadeDetectionDesc="启用淡入淡出检测以在过渡期间调整编码。\n检测淡入、淡出和交叉淡入淡出效果。\n编码器在淡入淡出期间调整量化和预测权重以获得更好质量。\nAUTO 让编码器决定何时启用。略微增加 CPU 负载。"
ContentInfoDesc="指定内容类型以优化编码器设置。\n不同内容类型（游戏、会议、监控）受益于不同的编码策略。\n正确选择可提高压缩效率和视觉质量。\n不直接影响 GPU/CPU 负载。"
GPUNumberDesc="在多 GPU 系统上选择用于编码的 GPU。\nGPU 编号取决于系统枚举顺序。\n更换 GPU 不影响编码质量，仅改变编码运行在哪个硬件上。\n适用于同时拥有集成和独立 Intel GPU 的系统。"

# Screen Content Tools
ScreenContentTools="屏幕内容工具"
ScreenContentTools.Tooltip="针对屏幕内容优化编码（文字、UI 元素、滚动）。\n启用针对屏幕截图中锐利边缘和重复模式的特殊编码工具。\n自动：仅在受支持的硬件上启用（Lunar Lake+）。\n可能略微增加 GPU 负载。不推荐用于自然视频内容。"
AUTO_OFF_ON="自动 / 关闭 / 开启"

# Separate I/P/B QP
SeparateIPBQP="分离 I/P/B 量化参数"
SeparateIPBQPDesc="允许为 I、P、B 帧分别设置不同的 QP 值。\nI 帧通常使用较低 QP（更高质量），因为它们是参考帧。\nB 帧可以使用较高 QP（较低质量），因为被引用频率较低。\n提供更精细的质量分布控制。不影响 GPU 负载。"
CQP="恒定量化参数"
CQPDesc="所有帧类型的恒定量化参数。\n数值越低：质量越高，码率越高。范围 1-51（AVC/HEVC）或 1-63（AV1/VP9）。\n仅在分离 I/P/B QP 禁用时使用。不影响 GPU 负载。"
QPI="I帧量化参数"
QPIQPPQPDesc="量化参数值。数值越低画质越好，码率越高。\n范围 1-51（AVC/HEVC）或 1-63（AV1/VP9）。不影响 GPU 负载。"
QPP="P帧量化参数"
QPB="B帧量化参数"

