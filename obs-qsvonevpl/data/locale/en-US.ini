TargetUsage="Target Usage"
TargetUsageDesc="Controls the trade-off between encoding speed and compression efficiency.\nTU1 (Veryslow): best compression and quality, slowest encoding — highest GPU/CPU load.\nTU7 (Veryfast): fastest encoding, larger files at same quality — lowest GPU/CPU load.\nLower target usage increases GPU/CPU load but maximizes quality-per-bit."
Bitrate="Bitrate"
BitrateDesc="Target bitrate in Kbps. The encoder attempts to maintain this average bitrate.\nHigher values produce better quality but require more bandwidth and may slightly increase GPU load due to finer quantization."
CustomBufferSize="Custom VBV Buffer"
CustomBufferSizeDesc="When enabled, allows specifying a custom VBV (Video Buffering Verifier) buffer size.\nLarger buffers allow more bitrate variation between frames, improving quality in complex scenes.\nSmaller buffers reduce latency but may cause quality drops during scene changes."
BufferSize="VBV Buffer Size (KB)"
BufferSizeDesc="VBV buffer size in KB. Controls how much bitrate can vary between frames.\nLarger buffers: better quality in complex scenes, higher latency.\nSmaller buffers: lower latency, but may cause quality drops in high-motion scenes."
MaxBitrate="Max Bitrate"
MaxBitrateDesc="Maximum bitrate in Kbps. Caps the peak bitrate the encoder can output.\nOnly applicable for VBR and VCM rate control modes. Does not affect GPU usage."
Profile="Profile"
ProfileDesc="Defines the set of encoding features and capabilities.\n\nHEVC Profiles:\nmain: 8-bit 4:2:0 encoding. Standard profile, maximum compatibility.\n  Best for general recording/streaming on all Intel GPUs (Gen12+).\n  OBS color format: NV12 or I420 (will be converted to NV12).\n  Limitations: 4:2:0 chroma only; max 8-bit depth.\nmain10: 10-bit 4:2:0 encoding. 10-bit depth reduces color banding in gradients.\n  Required for HDR10 output. Slightly higher bitrate efficiency than 8-bit.\n  Best for HDR content or smooth gradients (sky, fog, dark scenes).\n  OBS color format: P010 or I010 (will be converted to P010).\n  Limitations: 4:2:0 chroma only; max 10-bit depth.\nrext: Range Extension. 4:2:0/4:2:2/4:4:4 chroma + 8/10/12-bit depth.\n  Professional-grade color fidelity. Requires Tiger Lake (Gen12) or newer.\n  Best for color grading intermediates, screen capture with colored text/subpixel.\n  OBS color format:\n    4:2:0 8-bit: NV12 / I420\n    4:2:0 10-bit: P010 / I010\n    4:2:2 8-bit: YUY2\n    4:2:2 10-bit: P216\n    4:4:4 8-bit: AYUV / I444\n    4:4:4 10/12-bit: P416 / I412\n  Limitations: max 10-bit depth when Low Power is ON; max 12-bit depth when Low Power is OFF.\nscc: Screen Content Coding. Optimized for screen capture (text, UI, static regions).\n  Uses IBC (Intra Block Copy) and palette mode for perfect sharp edges.\n  Requires Tiger Lake (Gen12) or newer. Not recommended for natural video.\n  OBS color format:\n    4:2:0 8-bit: NV12 / I420\n    4:2:0 10-bit: P010 / I010\n    4:4:4 8-bit: AYUV / I444\n  Limitations:\n    Requires Low Power = ON.\n    IP-only: B-frames are not used.\n    Does NOT support 4:2:2 chroma.\n\nHigher profiles require more capable decoder hardware. Does not affect encoder GPU usage."
Tier="Tier"
TierDesc="HEVC tier determines maximum bitrate and compression constraints.\nMain tier: targets most applications with standard bitrate limits.\nHigh tier: allows higher bitrates for demanding scenarios (4K/8K, high frame rate).\nDoes not affect GPU usage."
Level="Level"
LevelDesc="Defines resolution, frame rate, and bitrate constraints.\nAuto selects based on current encoding parameters.\nIncorrect level may cause playback issues on some devices. Does not affect GPU usage."
RateControl="Rate Control"
**RateControlDesc="Select rate control algorithm.\nCBR: Constant bitrate, predictable bandwidth — best for live streaming.\nVBR: Variable bitrate, better quality per bit — good for recording.\nCQP: Constant QP, QP-based quality encoding — for maximum quality regardless of file size.\n(Use ICQ if file size matters)\nAVBR: Adaptive VBR — balances quality and bitrate stability.\nICQ: Intelligent Constant Quality, consistent visual quality — better quality than CQP at same file size.\nVCM: Variable Complexity Mode — adapts to content complexity.\nQVBR: Quality-defined VBR — VBR mode based on ICQ.\nRate control selection does not directly affect GPU load."**
ICQQuality="ICQ Quality"
ICQQualityDesc="Quality target for ICQ (Intelligent Constant Quality) rate control.\nRange 1-51 (1-63 for VP9). Lower values = better quality, higher bitrate.\nOnly effective when Rate Control is set to ICQ. Does not affect GPU usage."
QVBRQuality="QVBR Quality (ICQ)"
QVBRQuality.Tooltip="Quality level for QVBR rate control based on ICQ (Intelligent Constant Quality).\n1=best, 51=worst, 0=driver default. Does not affect GPU usage."
KeyframeIntervalSec="Keyframe Interval (0=auto)"
KeyframeIntervalSecDesc="Maximum interval between keyframes (I-frames) in seconds. 0 = auto.\nShorter intervals: faster seeking, better error recovery, but lower compression.\nLonger intervals: better compression, but slower seeking and more visible artifacts after packet loss.\nKeyframes are larger and require more GPU processing when encoded."
BFrames="B-frames"
MBBRC="MB-level BRC"
NumRefFrame="Number of Reference Frames"
NumRefActiveP="P-Frame Past Refs"
NumRefActiveBL0="B-Frame Past Refs"
NumRefActiveBL1="B-Frame Future Refs"
LookaheadDownSampling="Lookahead Downsampling"
GlobalMotionBiasAdjustment="Global Motion Bias"
DirectBiasAdjusment="Direct Bias Adjustment"
AdaptiveI="Adaptive I-Frames"
AdaptiveB="Adaptive B-Frames"
AdaptiveRef="Adaptive Reference Frames"
AdaptiveCQM="Adaptive Quantization Matrix"
Pyramid="Pyramid"
Trellis="Trellis Quantization"
Lookahead_Mode="Lookahead"
LookaheadDesc="Controls look-ahead rate control for improved bit allocation.\nHQ: full analysis of future frames — best quality, higher GPU/CPU load.\nLP: lightweight lookahead limited to B-frame depth — balanced performance.\nOFF: disables lookahead — lowest GPU/CPU load, but bitrate distribution may be less optimal.\nOn AVC, VBR is promoted to LA (LA_HRD with HRD conformance) and ICQ to LA_ICQ.\nOn HEVC/AV1, ScenarioInfo is auto-promoted to GAME_STREAMING when lookahead is on.\nThis is required for hardware EncTools lookahead."
LookaheadDepth="Lookahead Depth"
MotionVectorsOverpicBoundaries="MV Over Picture Boundaries"
UseRawRef="Use Raw Reference"
MVCostScalingFactor="MV Cost Scaling Factor"
RDO="Rate Distortion Optimization"
HRDConformance="HRD Conformance"
LowDelayBRC="Low Delay BRC"
LowDelayBRCDesc="Configures the bitrate controller for low-latency operation.\nReduces the averaging window for bitrate calculation.\nLower latency but may cause less consistent quality across frames.\nDoes not affect GPU usage. Use for real-time interactive applications."
LowDelayHRD="Low Delay HRD"
LowDelayHRDDesc="When enabled, reduces the HRD (Hypothetical Reference Decoder) buffer size constraint\nfor low-latency operation. Requires HRD Conformance to be ON or AUTO."
SkipFrame="Skip Frame"
SkipFrameDesc="Controls how the encoder handles frame skip requests from the driver.\nSkips are triggered when the encoder is overloaded or the bitrate buffer\nrisks overflowing.\n\nNo Skip: never skip frames. All frames are encoded regardless of driver\nrequests. Ensures complete output but may cause bitrate overshoot or\nencoding lag under heavy load.\n\nInsert Dummy: when a skip is requested, a placeholder frame is inserted\nwhere all macroblocks are encoded as skip (effectively copying the\nprevious frame). Only non-reference P/B frames can be skipped.\nMaintains frame count and timing.\n\nInsert Nothing: when a skip is requested, the frame is dropped entirely\nand nothing is inserted into the bitstream. Reduces output size and\nbitrate, but creates a gap in the frame sequence that may cause\ntiming issues in some players.\n\nBRC Only: the skip request only affects bitrate control statistics\n(telling BRC how many frames were missed). The current frame is still\nencoded normally. Useful for maintaining quality while keeping BRC\naware of skipped frames.\n\nAuto: let the driver decide the best mode.\nOnly applies to AVC and HEVC encoders."
AsyncDepth="Async Depth"
AdaptiveLTR="Adaptive LTR"
SampleAdaptiveOffset="Sample Adaptive Offset"
SampleAdaptiveOffsetDesc="SAO (Sample Adaptive Offset) filter reduces ringing artifacts in HEVC.\nControls which color channels the filter is applied to.\nLUMA: reduces artifacts on brightness edges.\nCHROMA: reduces color banding.\nALL: both luma and chroma.\nDISABLE: turns off SAO. Minimal GPU impact."
GPB="GPB"
TuneQuality="Tune Encode Quality"
TuneQuality.Tooltip="Selects the perceptual quality target the AV1 encoder optimizes for.\nOFF: no quality tuning.\nVMAF/PERCEPTUAL: enable perceptual pre-filtering via saliency map (increases CPU load).\nOnly available for AV1 and requires ONEVPL_EXPERIMENTAL."
EncTools="Encoder Tools"
EncToolsSceneChange="Scene Change Detection"
EncToolsSceneChangeDesc="Enables scene change detection to adjust encoding parameters at transitions.\nDetects hard cuts, fades, and dissolves between scenes.\nEncoder inserts I-frames or adjusts QP at scene boundaries for better quality.\nSlightly increases CPU load during scene transitions."
EncToolsAdaptiveRefP="Adaptive P-Ref Selection"
EncToolsAdaptiveRefPDesc="Enables adaptive P-frame reference selection for better quality.\nEncoder analyzes content characteristics to choose optimal reference frames.\nImproves compression efficiency for P-frames. Slightly increases CPU load."
EncToolsAdaptiveRefB="Adaptive B-Ref Selection"
EncToolsAdaptiveRefBDesc="Enables adaptive B-frame reference selection from both past and future frames.\nEncoder dynamically chooses the best references for each B-frame.\nImproves B-frame compression efficiency. Slightly increases CPU load."
EncToolsAdaptivePyramidQuantP="Adaptive Pyramid QP (P-Frames)"
EncToolsAdaptivePyramidQuantPDesc="Enables adaptive quantization of P-frames based on their temporal importance.\nFrames higher in the pyramid hierarchy get finer quantization (better quality).\nImproves overall compression efficiency. Slightly increases CPU load."
EncToolsAdaptivePyramidQuantB="Adaptive Pyramid QP (B-Frames)"
EncToolsAdaptivePyramidQuantBDesc="Enables adaptive quantization of B-frames based on their temporal hierarchy level.\nHigher-level B-frames get finer quantization; lower-level get coarser.\nImproves rate-distortion performance in B-pyramid structures. Slightly increases CPU load."
EncToolsAdaptiveMBQP="Adaptive MB QP"
EncToolsAdaptiveMBQPDesc="Enables adaptive macroblock-level quantization within each frame.\nAllocates more bits to visually complex areas, fewer bits to simple areas.\nImproves subjective visual quality at the same bitrate.\nIncreases CPU load due to per-macroblock analysis."
EncToolsBRCBufferHints="BRC Buffer Hints"
EncToolsBRCBufferHintsDesc="Provides buffer occupancy hints to the bitrate controller.\nHelps the BRC make smoother bitrate allocation decisions across frames.\nReduces bitrate fluctuation and improves quality consistency.\nSlightly increases CPU load."
EncToolsBRC="BRC Optimization"
EncToolsBRCDesc="Enables advanced bitrate controller optimizations via EncTools.\nImproves rate-distortion performance through smarter bit allocation.\nCan achieve better quality at the same bitrate. Increases CPU load."
EncToolsSaliencyMapHint="Saliency Map Hint"
EncToolsSaliencyMapHintDesc="Provides visual saliency map to guide bit allocation.\nEncoder allocates more bits to visually important regions (faces, text, motion).\nImproves subjective quality where viewers focus attention.\nIncreases CPU load due to saliency analysis."
LowPower_Mode="Low Power Mode"
ScenarioInfo="Scenario Info"
ContentInfo="Content Info"
TransformSkip="Transform Skip"
FadeDetection="Fade Detection"
VideoProcessing_Filters="Video Processing Filters"
Denoise_Strength="Denoise Strength"
Denoise_StrengthDesc="Strength of the denoising filter (1-100). Higher values apply stronger noise reduction but may remove fine details.\nOnly effective when Denoise Mode is set to a manual mode.\nIncreases GPU load proportionally to strength. Does not affect CPU usage."
Denoise_Mode="Denoise Mode"
Denoise_ModeDesc="Selects the denoising filter mode and placement.\nAUTO: driver decides optimal denoising strategy.\nMANUAL: allows specifying the filter strength.\nPRE ENCODE: filters frames before encoding — reduces noise in source.\nPOST ENCODE: filters reconstructed frames — reduces encoding artifacts.\nAll modes increase GPU load. Does not affect CPU usage."
Scaling_Mode="Scaling Mode"
Scaling_ModeDesc="Controls the scaling/resizing filter used when the encoder needs to resize the video frame.\nQUALITY | ADVANCED: best visual quality, higher GPU load.\nLOWPOWER modes: trade quality for performance, lower GPU load.\nAUTO: driver selects the optimal mode.\nOnly affects GPU load when scaling is active (output resolution differs from input)."
VPPOutWidth="VPP Output Width"
VPPOutWidthDesc="Custom output width in pixels when scaling is active. 0 = use input width."
VPPOutHeight="VPP Output Height"
VPPOutHeightDesc="Custom output height in pixels when scaling is active. 0 = use input height."
ImageStab_Mode="Image Stabilization Mode"
ImageStab_ModeDesc="Enables video stabilization to reduce camera shake.\nUPSCALE: fills missing border areas by upscaling the visible frame.\nBOXING: adds black borders to hidden areas.\nAUTO: driver decides the optimal mode.\nIncreases GPU load when enabled. Does not affect CPU usage."
Detail_Enhancement="Detail Enhancement"
Detail_EnhancementDesc="Enables detail enhancement filter to sharpen and enhance fine details in the video before encoding.\nCan improve perceived sharpness at the cost of encoding efficiency.\nIncreases GPU load.\nDetail enhancement may also increase bitrate since sharper frames are harder to compress."
Detail_Factor="Detail Enhancement Factor"
Detail_FactorDesc="Strength of the detail enhancement filter (1-100). Higher values produce sharper images but may introduce artifacts and increase bitrate.\nHigher strength increases GPU load slightly. Does not affect CPU usage."
PercEncPrefilter="Percentage Enc Prefilter"
PercEncPrefilterDesc="Percentage-based encoder pre-filtering. Applies preprocessing to the video frames to improve encoding efficiency.\nCan help reduce artifacts in high-motion content.\nIncreases GPU load. Does not affect CPU usage."
IntraRefEncoding="Intra Refresh Encoding"
IntraRefEncodingDesc="Intra refresh distributes I-frame data across multiple frames instead of a single large I-frame.\nUseful for low-latency applications to maintain consistent frame sizes and reduce latency spikes.\nAvoids the sudden bitrate burst of a full I-frame, which helps streaming stability.\nDoes not affect GPU/CPU usage compared to regular encoding."
IntraRefType="Intra Refresh Direction"
IntraRefTypeDesc="Direction of the intra refresh pattern.\nVERTICAL: refreshes columns of macroblocks sequentially from left to right.\nHORIZONTAL: refreshes rows from top to bottom.\nChoice affects the visual pattern of the refresh wave but does not affect GPU/CPU usage."
IntraRefCycleSize="Intra Refresh Cycle Size"
IntraRefQPDelta="Intra Refresh QP Delta"
Select_GPU="Select GPU"
Accuracy="Accuracy"
Convergence="Convergence"
Latency="Latency"
SubjectiveVideoEnhancements="Subjective Video Enhancements"
8bitUnsupportedHdr="OBS does not support 8-bit output of Rec. 2100."
10bitUnsupportedAvc="Cannot perform 10-bit encode on Intel QSV H.264 encoder."
NumRefFrame.Tooltip="Maximum number of reference frames (defines DPB size for AVC/HEVC).\nHigher values: better compression, more GPU memory usage.\n0 = parameter not specified, driver uses default.\nDoes not directly affect GPU compute load."
GOPOptFlag="GOP Status Flag"
GOPOptFlag.Tooltip="CLOSED: encoder generates closed GOP — frames in this GOP do not reference previous GOP.\nBetter for seeking and streaming, but slightly lower compression.\nSTRICT: encoder must strictly follow the defined GOP structure.\nIf not set, encoder may adapt GOP structure for better efficiency.\nDoes not affect GPU usage."
GlobalMotionBiasAdjustment.Tooltip="Enables global motion bias adjustment to improve motion estimation.\nHelps encoder detect and compensate for global motion (camera pan, zoom, rotation).\nMay improve compression for scenes with camera movement. Minimal GPU impact."
DirectBiasAdjusment.Tooltip="Set this flag to ON to bias the ENC mode decision algorithm toward fewer B Direct/Skip types.\nApplies only to B-frames; all other frames will ignore this setting.\nMay improve visual quality for complex B-frames at the cost of slightly higher bitrate.\nMinimal GPU impact."
AdaptiveI.Tooltip="Allows the encoder to dynamically insert I-frames when needed.\nWhen ON, encoder may change P or B frames to I-frames based on content.\nImproves quality at scene changes but may temporarily increase bitrate.\nMinimal impact on GPU usage."
AdaptiveB.Tooltip="Allows the encoder to change B-frames to P-frames when beneficial.\nWhen ON, encoder may use P-frames instead of B-frames for better prediction.\nCan improve quality in high-motion scenes where B-frame prediction is less effective.\nMinimal impact on GPU usage."
AdaptiveRef.Tooltip="If this flag is set to ON, encoder adaptively selects list of reference frames to improve encoding quality.\nEnabling of the flag can increase computation complexity and introduce additional delay."
AdaptiveCQM.Tooltip="If set to ON, encoder adaptively selects one of implementation-defined quantization matrices for each frame.\nNon-default matrices aim to improve subjective visual quality under certain conditions.\nTheir number and definitions are API implementation specific.\nIf set to OFF, default quantization matrix is used for all frames.\nSlightly increases GPU/CPU load."
AdaptiveMaxFrameSize="Max Frame Size (bytes)"
ScenarioInfo.Tooltip="Specifies the encoding scenario to optimize encoder settings for the intended application.\nDifferent scenarios (streaming, archiving, conferencing) have different quality/latency trade-offs.\nEncoder adjusts internal parameters based on the chosen scenario.\nDoes not affect GPU/CPU usage directly."
TransformSkip.Tooltip="Enables transform skip mode for certain blocks.\nWhen beneficial, encoder skips the DCT/DST transform to preserve sharp edges.\nUseful for screen content (text, UI) and graphics with sharp transitions.\nMay slightly increase bitrate for natural video. Minimal GPU impact."
FadeDetection.Tooltip="Enables fade detection to adjust encoding during fade transitions.\nDetects fade-in, fade-out, and cross-fade effects.\nEncoder adjusts quantization and prediction weights for better quality during fades.\nAUTO lets the encoder decide when to enable. Slightly increases CPU load."
Trellis.Tooltip="Controls trellis quantization in the encoder.\nTrellis quantization improves compression efficiency by optimizing quantization decisions.\nIncreases quality-per-bit but adds significant GPU/CPU computation overhead.\nRecommended for quality-focused encoding; disable for performance-critical scenarios."
LookaheadDepth.Tooltip="Specifies the depth of the look-ahead rate control algorithm.\nHigher values: encoder analyzes more future frames — better bitrate allocation, higher GPU/CPU load.\nLower values: less analysis — lower GPU/CPU load, but less optimal bitrate distribution.\nValues are in the 1 to 100 range, inclusive."
MVOverpicBoundaries.Tooltip="Controls whether motion vectors can reference samples outside picture boundaries.\nOFF: no out-of-boundary samples used — standard compliant, lower compression.\nON: allows out-of-boundary samples — may improve compression at picture edges.\nMinimal impact on GPU usage."
RepartitionCheck="Repartition Check Enable"
RepartitionCheckDesc="Controls whether AVC encoder attempts prediction from smaller block partitions.\nWhen enabled, encoder evaluates more partition sizes for better compression.\nImproves compression efficiency but increases GPU/CPU computation.\nOnly applicable to AVC (H.264) encoding."
UseRawRef.Tooltip="Set this flag to ON to use raw (uncompressed) frames as reference instead of reconstructed frames.\nCan improve quality by avoiding error propagation from lossy reconstruction.\nSignificantly increases GPU/CPU memory bandwidth usage.\nMay cause compatibility issues with some encoder features."
MVCostScalingFactor.Tooltip="Scales motion vector cost in HME mode decision.\nLower value = more aggressive motion search (0=most aggressive, MV cost=0).\nHigher value = more conservative (3=most conservative, MV cost=1/8 default).\nOnly effective for H.264 (AVC) encoding.\nRequires Global Motion Bias Adjustment = ON."
RDO.Tooltip="Enables Rate-Distortion Optimization for encoding decisions.\nEncoder evaluates multiple encoding modes and selects the best quality-per-bit option.\nSignificantly improves compression efficiency but increases GPU/CPU load substantially.\nRecommended for quality-focused encoding; disable for low-latency or performance-critical use."
AsyncDepth.Tooltip="Specifies how many asynchronous operations the encoder queues before synchronization.\nHigher values: better GPU utilization and throughput — but more memory usage.\nLower values: lower latency and memory usage — but may reduce GPU utilization.\nRecommended range: 4-8 for most use cases. Does not affect encoding quality."
Latency.Tooltip="There is a trade-off between latency and quality.\nNormal: favors quality, may result in > 2s end-to-end latency.\nUltra-low: < 500ms end-to-end latency, may reduce quality.\nDoes not affect GPU/CPU usage directly."
EncTools.Tooltip="Enables additional frame processing using advanced encoder functionality.\nEncTools uses CPU power to analyze and optimize frames before encoding.\nImproves encoding quality and compression efficiency.\nSignificantly increases CPU usage; may reduce encoding throughput on CPU-limited systems.\nMay affect encoder stability with certain driver versions."
HEVCGPB.Tooltip="Controls whether HEVC encoder uses GPB (Generalized P/B) frames.\nOFF: encoder uses regular P-frames instead of GPB frames.\nON: GPB frames are used — they are B-frames without backward references.\nGPB frames can improve compression while maintaining low latency.\nMinimal impact on GPU usage."
BFramesDesc="Number of B-frames between I/P key frames. 0 = unspecified GOP structure.\nB-frames improve compression efficiency by using both past and future references.\nMore B-frames: better compression, but higher encoding latency and GPU load.\nRecommended: 4 for best compression efficiency in tested scenarios.\nWhen GPB is ON, GPB frames (B-frames without backward references) replace P-frames."
HRDConformanceDesc="Controls HRD (Hypothetical Reference Decoder) conformance.\nON: encoder produces strictly HRD-conformant bitstream — required for some broadcast standards.\nOFF: encoder may violate HRD constraints for better compression.\nDoes not affect GPU usage. May increase bitrate slightly when ON."
MBBRCDesc="Enables macroblock-level bitrate control for better subjective visual quality.\nAllocates bits more intelligently within each frame based on content complexity.\nIncreases GPU/CPU load and may slightly reduce objective quality metrics (PSNR/SSIM)."
RDODesc="Enables Rate-Distortion Optimization for encoding decisions.\nEncoder evaluates multiple encoding modes and selects the best quality-per-bit option.\nSignificantly improves compression efficiency but increases GPU/CPU load substantially.\nRecommended for quality-focused encoding; disable for low-latency or performance-critical use."
AdaptiveIDesc="Allows the encoder to dynamically insert I-frames when needed.\nWhen ON, encoder may change P or B frames to I-frames based on content.\nImproves quality at scene changes but may increase bitrate temporarily.\nMinimal impact on GPU usage."
AdaptiveBDesc="Allows the encoder to change B-frames to P-frames when beneficial.\nWhen ON, encoder may use P-frames instead of B-frames for better prediction.\nCan improve quality in high-motion scenes where B-frame prediction is less effective.\nMinimal impact on GPU usage."
AdaptiveRefDesc="Enables adaptive selection of reference frames for better compression.\nEncoder dynamically chooses the best reference frames for each block.\nImproves encoding quality but increases GPU/CPU computation.\nMay introduce additional encoding delay."
AdaptiveLTRDesc="Enables adaptive Long-Term Reference (LTR) frame management.\nEncoder may mark, modify, or remove LTR frames based on content and parameters.\nLTR frames can improve quality for scenes with repetitive content or background.\nSlightly increases GPU/CPU load."
AdaptiveCQMDesc="Enables adaptive selection of quantization matrices per frame.\nNon-default matrices aim to improve subjective visual quality in certain conditions.\nEncoder selects from implementation-defined matrices based on content analysis.\nSlightly increases GPU/CPU load."
PyramidDesc="Enables hierarchical pyramid reference structure for B-frames.\nP-pyramid: improves coding efficiency when B-frames=0.\nB-pyramid: arranges B-frames in temporal layers for better compression.\nIncreases GPU/CPU load slightly but improves compression efficiency."
UseRawRefDesc="Uses raw (uncompressed) frames as reference instead of reconstructed frames.\nCan improve quality by avoiding error propagation from lossy reconstruction.\nSignificantly increases GPU/CPU memory bandwidth usage.\nMay cause compatibility issues with some encoder features."
GlobalMotionBiasDesc="Enables global motion bias adjustment for motion estimation.\nHelps the encoder detect and compensate for global motion (camera pan, zoom, rotation).\nMay improve compression efficiency for scenes with camera movement.\nMinimal impact on GPU usage."
DirectBiasDesc="Biases the mode decision algorithm toward fewer B Direct/Skip types.\nApplies only to B-frames; all other frames ignore this setting.\nMay improve visual quality for complex B-frames at the cost of slightly higher bitrate.\nMinimal impact on GPU usage."
MVOverpicBoundariesDesc="Controls whether motion vectors can reference samples outside picture boundaries.\nOFF: no out-of-boundary samples used — standard compliant, lower compression.\nON: allows out-of-boundary samples — may improve compression at picture edges.\nMinimal impact on GPU usage."
TrellisDesc="Controls trellis quantization in the encoder.\nTrellis quantization improves compression efficiency by optimizing quantization decisions.\nIncreases quality-per-bit but adds significant GPU/CPU computation overhead.\nRecommended for quality-focused encoding; disable for performance-critical scenarios."
LookaheadDSDesc="Controls downsampling factor for lookahead analysis.\n1X: full resolution analysis — best quality, highest GPU/CPU load.\n2X: half resolution — good balance of quality and performance.\n4X: quarter resolution — fastest, lowest quality from lookahead.\nOnly effective when Lookahead mode is enabled."
VPPDesc="Video Processing Pipeline filters for additional frame processing.\nEnabling VPP filters adds GPU processing steps before/after encoding.\nEach enabled filter increases GPU load and may reduce encoding throughput.\nDisable unused filters to maximize encoding performance."
LowPowerDesc="Hint to enable low power consumption mode for encoders.\nIntel Arc graphics adapters: only work with LowPower enabled; changing this parameter has no effect on operation.\nIntegrated Intel UHD graphics: can work in both modes; available features may vary.\nOn some hardware (e.g., UHD 730) LowPower mode may significantly reduce quality.\nGPU power consumption and clock speeds are adjusted."
IntraRefCycleSizeDesc="Specifies the number of pictures within a refresh cycle, starting from 2.\nDetermines how many frames it takes to complete one full intra refresh pass.\nLarger cycles spread the refresh more gradually, reducing per-frame bitrate impact.\nDoes not affect GPU/CPU usage. 0 and 1 are invalid values."
IntraRefQPDeltaDesc="Specifies QP difference for inserted intra macroblocks in the refresh row.\nNegative values: higher quality for refreshed blocks, but larger frame size.\nPositive values: lower quality, smaller frame size.\nSigned values in the -51 to 51 range. Does not affect GPU/CPU usage."
NumRefActivePDesc="Number of past frames P-frames can reference for prediction.\nHigher values: better compression, but increased GPU memory bandwidth and load.\nMay cause frame drops on lower-end GPUs at high values.\nRecommended: 2-4 for most use cases."
NumRefActiveBL0Desc="Number of past frames B-frames can reference (forward prediction).\nHigher values: better B-frame compression, but increased GPU load.\nMay cause frame drops on lower-end GPUs at high values.\nRecommended: 2 for most use cases."
NumRefActiveBL1Desc="Number of future frames B-frames can reference (backward prediction).\nHigher values: better B-frame compression, but increased encoding delay and GPU load.\nMay cause frame drops on lower-end GPUs at high values.\nRecommended: 1-2 for most use cases."
ScenarioInfoDesc="Specifies the encoding scenario to optimize encoder settings.\nDifferent scenarios (streaming, archiving, conferencing) have different quality/latency trade-offs.\nEncoder adjusts internal parameters for the chosen scenario.\nDoes not affect GPU/CPU usage directly."
TransformSkipDesc="Enables transform skip mode for certain blocks.\nWhen beneficial, encoder skips the DCT/DST transform to preserve sharp edges.\nUseful for screen content (text, UI) and graphics with sharp transitions.\nMay slightly increase bitrate for natural video. Minimal GPU impact."
FadeDetectionDesc="Enables fade detection to adjust encoding during fade transitions.\nDetects fade-in, fade-out, and cross-fade effects.\nEncoder adjusts quantization and prediction weights for better quality during fades.\nAUTO lets the encoder decide when to enable. Slightly increases CPU load."
ContentInfoDesc="Specifies the content type to optimize encoder settings.\nDifferent content types (gaming, conference, surveillance) benefit from different encoding strategies.\nProper selection can improve compression efficiency and visual quality.\nDoes not affect GPU/CPU usage directly."
GPUNumberDesc="Selects which GPU to use for encoding on multi-GPU systems.\nGPU numbering depends on system enumeration order.\nChanging GPU does not affect encoding quality, only which hardware runs the encoder.\nUseful for systems with both integrated and discrete Intel GPUs."

# Screen Content Tools
ScreenContentTools="Screen Content Tools"
ScreenContentTools.Tooltip="Optimizes encoding for screen content (text, UI elements, scrolling).\nEnables special coding tools for sharp edges and repeated patterns in screen captures.\nAuto: enables only on supported hardware (Lunar Lake+).\nMay increase GPU load slightly. Not recommended for natural video content."
AUTO_OFF_ON="Auto / Off / On"

# Separate I/P/B QP
SeparateIPBQP="Separate I/P/B QP"
SeparateIPBQPDesc="Allows setting different QP values for I, P, and B frames independently.\nI-frames typically use lower QP (higher quality) as they serve as references.\nB-frames can use higher QP (lower quality) since they are referenced less often.\nProvides finer control over quality distribution. Does not affect GPU usage."
CQP="CQP"
CQPDesc="Constant Quantization Parameter for all frame types.\nLower values: higher quality, higher bitrate. Range 1-51 (AVC/HEVC) or 1-63 (AV1/VP9).\nOnly used when Separate I/P/B QP is disabled. Does not affect GPU usage."
QPI="QPI"
QPIQPPQPDesc="Quantization parameter value. Lower values = higher quality, higher bitrate.\nRange 1-51 (AVC/HEVC) or 1-63 (AV1/VP9). Does not affect GPU usage."
QPP="QPP"
QPB="QPB"

