# AV1 AuxData
AV1CDEF="CDEF Filter"
AV1CDEFDesc="Constrained Directional Enhancement Filter. Reduces ringing artifacts around edges in AV1 encoding.\nAffects visual quality and compression efficiency. Minimal GPU impact."
AV1Restoration="Restoration Filter"
AV1RestorationDesc="Loop Restoration Filter (Wiener/Self-Guided). Recovers lost high-frequency details and reduces artifacts.\nImproves perceptual quality at the cost of slight encoding overhead.\nMinimal GPU impact."
AV1LoopFilter="Loop Filter"
AV1LoopFilterDesc="Deblocking loop filter control. Reduces blocking artifacts at block boundaries.\nDisabling may improve sharpness but can introduce visible artifacts.\nMinimal GPU impact."
AV1SuperRes="Super Resolution"
AV1SuperResDesc="Adaptive super resolution for AV1. Downscales then upscales high-detail frames to improve coding efficiency at low bitrates.\nUseful for streaming scenarios. Increases GPU load due to additional scaling operations."
AV1InterpFilter="Interpolation Filter"
AV1InterpFilterDesc="Motion compensation interpolation filter type. Controls how sub-pixel motion is interpolated.\nEIGHTTAP_SHARP: preserves more detail, slightly higher GPU load.\nBILINEAR: faster but softer, lower GPU load."
AV1ErrorResilient="Error Resilient Mode"
AV1ErrorResilientDesc="Error resilient encoding mode. Inserts additional sync points in the bitstream to aid recovery from data loss.\nUseful for live streaming but may reduce compression efficiency.\nDoes not affect GPU/CPU usage."
AV1Segmentation="AV1 Segmentation"
AV1SegmentationDesc="Enables AV1 segmentation with a static two-segment map.\nThe center 50% of the frame uses segment 1 with a QP delta of -10\nfor improved quality in the focal region.\nOnly applicable to AV1 encoding.\nIncreases GPU load slightly due to per-segment mode decisions."

# Deblocking
Deblocking="Deblocking Filter"
DeblockingDesc="Deblocking filter control. Reduces blocking artifacts at block boundaries.\nEnabling this trades 1x sharpness for 0.5x smoothness.\nRecommended to keep disabled for non-natural video (screen capture, desktop, etc.).\nDisabling yields significant sharpness improvement, recommended for high-quality recording (default).\nMinimal GPU impact."

# VPP MCTF
VPPMCTF="MCTF (Motion Compensated Temporal Filtering)"
VPPMCTFDesc="Motion Compensated Temporal Filter. Reduces temporal noise by analyzing motion between frames.\nMore effective than spatial denoise for video content with motion.\nMay cause motion blur at high strengths.\nHigher values significantly increase GPU consumption. Does not affect CPU usage."
VPPMCTFStrength="MCTF Filter Strength"
VPPMCTFStrengthDesc="Strength of the MCTF temporal filter. Range 0-20.\nHigher values provide stronger noise reduction but may introduce motion blur.\nHigher values significantly increase GPU consumption. Does not affect CPU usage."

# Weighted Prediction
WeightedPred="Weighted Prediction"
WeightedPredDesc="Weighted prediction for P-frames. Allows weighting reference samples to improve prediction efficiency for fades and cross-fades.\nMay improve compression for content with lighting changes. Minimal GPU impact."
WeightedBiPred="Weighted Biprediction"
WeightedBiPredDesc="Weighted bi-prediction for B-frames. Extends weighted prediction to bidirectional references.\nUseful for fade transitions and dissolve effects. Minimal GPU impact."

# Adaptive Max Frame Size
AdaptiveMaxFrameSize="Max Frame Size (bytes)"
AdaptiveMaxFrameSizeDesc="Limits the maximum encoded frame size in bytes.\n0 = driver selects automatically. Set a non-zero value to prevent oversized frames.\nOversized frames can cause buffer underflow in streaming scenarios.\nDoes not affect GPU usage. Only supported on some rate control modes."



# Custom Coding Options
CustomCodingOptions="Custom Coding Options"
CustomCodingOptionsDesc="Allows overriding individual fields in mfxExtCodingOption, mfxExtCodingOption2,\nmfxExtCodingOption3, and mfxExtCodingOptionDDI. Use one 'Scope.Field=Value' per line. Scope: CO, CO2, CO3, CODDI. Value: ON, OFF, or a number. Lines starting with # or ; are ignored. Example:\nCO.RateDistortionOpt=ON\nCO2.FixedFrameRate=OFF\nCODDI.BRCPrecision=3"

