# VPP ProcAmp (Color Adjustment)
VPPProcAmp="ProcAmp (Color Adjustment)"
VPPProcAmpDesc="Color adjustment (ProcAmp) controls for brightness, contrast, hue, and saturation.\nAllows real-time color correction of the video signal before encoding.\nEnabling increases GPU load. Does not affect CPU usage."
VPPProcAmpBrightness="Brightness"
VPPProcAmpBrightnessDesc="Brightness adjustment (-100 to 100). 0 = no change.\nUsed to correct underexposed or overexposed video.\nHigher GPU load at extreme values."
VPPProcAmpContrast="Contrast"
VPPProcAmpContrastDesc="Contrast adjustment (0.0 to 10.0). 1.0 = no change.\nIncreases the difference between light and dark areas.\nHigher GPU load at extreme values."
VPPProcAmpHue="Hue"
VPPProcAmpHueDesc="Hue rotation (-180 to 180 degrees). 0 = no change.\nShifts the overall color tone of the video.\nMinimal GPU impact."
VPPProcAmpSaturation="Saturation"
VPPProcAmpSaturationDesc="Saturation adjustment (0.0 to 10.0). 1.0 = no change.\n0 = grayscale. Higher values produce more vivid colors.\nMinimal GPU impact."

# VPP Rotation
VPPRotation="Rotation"
VPPRotationDesc="Rotates the video frame by the specified angle.\n90/270 degree rotation changes width and height.\nIncreases GPU load. Does not affect CPU usage."

# VPP Mirroring
VPPMirroring="Mirroring"
VPPMirroringDesc="Mirrors the video frame horizontally, vertically, or both.\nUseful for front-facing camera correction or creative effects.\nMinimal GPU impact."

# VPP Frame Rate Conversion
VPPFRC="Frame Rate Conversion"
VPPFRCDesc="Converts the frame rate of the video stream.\nPRESERVE_TIMESTAMP: keeps original PTS values, adjusts duration.\nDISTRIBUTED_TIMESTAMP: redistributes PTS evenly across output frames.\nFRAME_INTERPOLATION: interpolates new frames for smoother motion.\nCombined modes use both timestamp adjustment and interpolation.\nEnabling increases GPU load significantly."
VPPFRCOutFPS="Output Frame Rate"
VPPFRCOutFPSDesc="Target output frame rate for frame rate conversion (fps).\nSet to a value different from the source frame rate to enable FRC.\nCommon values: 30, 60, 120, 144. Must be a valid display refresh rate."
