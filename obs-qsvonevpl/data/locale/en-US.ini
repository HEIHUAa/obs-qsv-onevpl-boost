TargetUsage="Target Usage"
TargetUsageDesc="Controls the trade-off between encoding speed and compression efficiency. TU1 (Veryslow) provides the best compression with highest quality but is slowest. TU7 (Veryfast) is fastest but produces larger files at the same quality level."
Bitrate="Bitrate"
BitrateDesc="Target bitrate in Kbps. The encoder attempts to maintain this average bitrate over the duration of the stream. Higher values produce better quality but require more bandwidth."
CustomBufferSize="Custom VBV Buffer"
CustomBufferSizeDesc="When enabled, allows specifying a custom VBV (Video Buffering Verifier) buffer size instead of using the driver default."
BufferSize="VBV Buffer Size (KB)"
BufferSizeDesc="VBV buffer size in KB. Larger buffers allow more bitrate variation between frames for better quality at the cost of increased latency."
MaxBitrate="Max Bitrate"
MaxBitrateDesc="Maximum bitrate in Kbps. Limits how high the bitrate can spike. Only applicable for VBR (Variable Bitrate) and VCM rate control modes."
Profile="Profile"
ProfileDesc="The codec profile defines the set of encoding features and capabilities. Higher profiles offer better compression and additional features but require more capable decoder hardware."
Tier="Tier"
TierDesc="HEVC tier determines maximum bitrate constraints. Main tier targets most applications. High tier allows higher bitrates for demanding scenarios."
Level="Level"
LevelDesc="Codec level defines resolution, frame rate, and bitrate constraints. Auto selects the appropriate level based on encoding parameters."
RateControl="Rate Control"
RateControlDesc="Selects the bitrate control algorithm. CBR: constant bitrate for streaming with predictable bandwidth. VBR: variable bitrate for better quality-per-bit. CQP: constant quantization, quality-based encoding. AVBR: adaptive VBR for balanced quality. ICQ: intelligent constant quality. VCM: variable complexity mode. QVBR: quality-defined VBR."
ICQQuality="ICQ Quality"
ICQQualityDesc="Quality target for Intelligent Constant Quality (ICQ) rate control. Range 1-51. Higher values produce better visual quality at the cost of higher bitrate."
QVBRQuality="QVBR Quality (ICQ)"
QVBRQuality.Tooltip="Quality level for QVBR rate control based on ICQ (Intelligent Constant Quality). 1=worst, 51=best, 0=driver default."
KeyframeIntervalSec="Keyframe Interval (0=auto)"
KeyframeIntervalSecDesc="Maximum interval between keyframes (I-frames) in seconds. 0 = auto. Shorter intervals improve seeking performance and error recovery but reduce compression efficiency."
BFrames="B-frames"
MBBRC="MB-level BRC"
NumRefFrame="Number of Reference Frames"
NumRefActiveP="P-Frame Past Refs"
NumRefActiveBL0="B-Frame Past Refs"
NumRefActiveBL1="B-Frame Future Refs"
LookaheadDownSampling="Lookahead Downsampling"
GlobalMotionBiasAdjustment="Global Motion Bias"
DirectBiasAdjusment="Direct Bias Adjustment"
AdaptiveI="Adaptive I-Frames"
AdaptiveB="Adaptive B-Frames"
AdaptiveRef="Adaptive Reference Frames"
AdaptiveCQM="Adaptive Quantization Matrix"
Pyramid="Pyramid"
Trellis="Trellis Quantization"
Lookahead_Mode="Lookahead"
LookaheadDesc="Controls look-ahead rate control for improved bit allocation. HQ (High Quality) performs full analysis of future frames with configurable depth. LP (Low Power) uses lightweight look-ahead limited to B-frame depth. OFF disables look-ahead analysis."
LookaheadDepth="Lookahead Depth"
MotionVectorsOverpicBoundaries="MV Over Picture Boundaries"
UseRawRef="Use Raw Reference"
MVCostScalingFactor="MV Cost Scaling Factor"
RDO="Rate Distortion Optimization"
HRDConformance="HRD Conformance"
LowDelayBRC="Low Delay BRC"
LowDelayBRCDesc="When enabled, configures the bitrate controller for low-latency operation by reducing the averaging window. May cause less consistent quality but reduces buffering delay."
LowDelayHRD="Low Delay HRD"
LowDelayHRDDesc="When enabled, reduces the HRD (Hypothetical Reference Decoder) buffer size constraint for low-latency operation. Requires HRD Conformance to be ON or AUTO."
AsyncDepth="Async Depth"
AdaptiveLTR="Adaptive LTR"
SampleAdaptiveOffset="Sample Adaptive Offset"
SampleAdaptiveOffsetDesc="Sample Adaptive Offset (SAO) filter reduces ringing artifacts in HEVC decoding. Controls which color channels the filter is applied to: LUMA only, CHROMA only, or ALL. DISABLE turns it off, AUTO lets the driver decide."
GPB="GPB"
TuneQualityMode="Tune Quality Mode"
EncTools="Encoder Tools"
EncToolsSceneChange="Scene Change Detection"
EncToolsSceneChangeDesc="Enables scene change detection within Encoder Tools. When a scene change is detected, the encoder may adjust encoding parameters to maintain quality across the transition."
EncToolsAdaptiveRefP="Adaptive P-Ref Selection"
EncToolsAdaptiveRefPDesc="Enables adaptive selection of P-frame reference frames to improve encoding quality based on content characteristics."
EncToolsAdaptiveRefB="Adaptive B-Ref Selection"
EncToolsAdaptiveRefBDesc="Enables adaptive selection of B-frame reference frames to improve encoding quality. B-frames can select from both past and future references."
EncToolsAdaptivePyramidQuantP="Adaptive Pyramid QP (P-Frames)"
EncToolsAdaptivePyramidQuantPDesc="Enables adaptive quantization of P-frames in the pyramid reference structure based on their temporal importance."
EncToolsAdaptivePyramidQuantB="Adaptive Pyramid QP (B-Frames)"
EncToolsAdaptivePyramidQuantBDesc="Enables adaptive quantization of B-frames in the pyramid reference structure based on their temporal hierarchy level."
EncToolsAdaptiveMBQP="Adaptive MB QP"
EncToolsAdaptiveMBQPDesc="Enables adaptive macroblock-level quantization to improve subjective visual quality by allocating more bits to complex areas."
EncToolsBRCBufferHints="BRC Buffer Hints"
EncToolsBRCBufferHintsDesc="Provides buffer occupancy hints to the bitrate controller for smoother bitrate allocation across frames."
EncToolsBRC="BRC Optimization"
EncToolsBRCDesc="Enables advanced bitrate controller optimizations provided by Encoder Tools for improved rate-distortion performance."
EncToolsSaliencyMapHint="Saliency Map Hint"
EncToolsSaliencyMapHintDesc="Provides saliency map information to guide the encoder in allocating more bits to visually important regions of the frame."
LowPower_Mode="Low Power Mode"
ScenarioInfo="Scenario Info"
ContentInfo="Content Info"
TransformSkip="Transform Skip"
FadeDetection="Fade Detection"
VideoProcessing_Filters="Video Processing Filters"
Denoise_Strength="Denoise Strength"
Denoise_StrengthDesc="Strength of the denoising filter (1-100). Higher values apply stronger noise reduction but may remove fine details. Only effective when Denoise Mode is set to a manual mode."
Denoise_Mode="Denoise Mode"
Denoise_ModeDesc="Selects the denoising filter mode and placement. AUTO lets the driver decide. MANUAL modes allow specifying the filter strength. PRE ENCODE filters before encoding, POST ENCODE filters the reconstructed frame."
Scaling_Mode="Scaling Mode"
Scaling_ModeDesc="Controls the scaling/resizing filter used when the encoder needs to resize the video frame. QUALITY | ADVANCED provides the best quality. LOWPOWER modes trade quality for performance. AUTO lets the driver decide."
VPPOutWidth="VPP Output Width"
VPPOutWidthDesc="Custom output width in pixels when scaling is active. 0 = use input width."
VPPOutHeight="VPP Output Height"
VPPOutHeightDesc="Custom output height in pixels when scaling is active. 0 = use input height."
ImageStab_Mode="Image Stabilization Mode"
ImageStab_ModeDesc="Enables video stabilization to reduce camera shake. UPSCALE fills missing border areas by upscaling the visible frame. BOXING adds black borders to hidden areas. AUTO lets the driver decide."
Detail_Enhancement="Detail Enhancement"
Detail_EnhancementDesc="Enables detail enhancement filter to sharpen and enhance fine details in the video before encoding. Can improve perceived sharpness at the cost of encoding efficiency."
Detail_Factor="Detail Enhancement Factor"
Detail_FactorDesc="Strength of the detail enhancement filter (1-100). Higher values produce sharper images but may introduce artifacts and increase bitrate."
PercEncPrefilter="Percentage Enc Prefilter"
PercEncPrefilterDesc="Percentage-based encoder pre-filtering. Applies preprocessing to the video frames to improve encoding efficiency. Can help reduce artifacts in high-motion content."
IntraRefEncoding="Intra Refresh Encoding"
IntraRefEncodingDesc="Intra refresh distributes I-frame data across multiple frames instead of a single large I-frame. Useful for low-latency applications to maintain consistent frame sizes and reduce latency spikes."
IntraRefType="Intra Refresh Direction"
IntraRefTypeDesc="Direction of the intra refresh pattern. VERTICAL refreshes columns of macroblocks sequentially from left to right. HORIZONTAL refreshes rows from top to bottom."
IntraRefCycleSize="Intra Refresh Cycle Size"
IntraRefQPDelta="Intra Refresh QP Delta"
Select_GPU="Select GPU"
Accuracy="Accuracy"
Convergence="Convergence"
Latency="Latency"
SubjectiveVideoEnhancements="Subjective Video Enhancements"
8bitUnsupportedHdr="OBS does not support 8-bit output of Rec. 2100."
10bitUnsupportedAvc="Cannot perform 10-bit encode on Intel QSV H.264 encoder."
NumRefFrame.Tooltip="Max number of all available reference frames (for AVC/HEVC, NumRefFrame defines DPB size). If NumRefFrame = 0, this parameter is not specified."
GOPOptFlag="GOP Status Flag"
GOPOptFlag.Tooltip="CLOSED:\nThe encoder generates closed GOP if this flag is set. Frames in this GOP do not use frames in previous GOP as reference. The encoder generates open GOP if this flag is not set. In this GOP frames prior to the first frame of GOP in display order may use frames from previous GOP as reference. Frames subsequent to the first frame of GOP in display order do not use frames from previous GOP as reference.\nSTRICT:\nThe encoder must strictly follow the given GOP structure as defined by parameter GopPicSize, B-frames etc. Otherwise, the encoder can adapt the GOP structure for better efficiency, whose range is constrained by parameter GopPicSize and B-frames etc."
GlobalMotionBiasAdjustment.Tooltip="Enables global motion bias."
DirectBiasAdjusment.Tooltip="Set this flag to ON to enable the ENC mode decision algorithm to bias to fewer B Direct/Skip types. Applies only to B-frames, all other frames will ignore this setting."
AdaptiveI.Tooltip="Controls insertion of I-frames by the encoder."
AdaptiveB.Tooltip="Controls changing of frame type from B to P."
AdaptiveRef.Tooltip="If this flag is set to ON, encoder adaptively selects list of reference frames to improve encoding quality.\nEnabling of the flag can increase computation complexity and introduce additional delay."
AdaptiveCQM.Tooltip="If this flag is set to ON, encoder adaptively selects one of implementation-defined quantization matrices for each frame. Non-default quantization matrices aim to improve subjective visual quality under certain conditions. Their number and definitions are API implementation specific. If this flag is set to OFF, default quantization matrix is used for all frames."
AdaptiveMaxFrameSize="Max Frame Size (bytes)"
ScenarioInfo.Tooltip="Specify the encoding scenario to optimize encoder settings for the intended application."
TransformSkip.Tooltip="Enable or disable transform skip. When enabled, the encoder may skip the transform step for certain blocks to improve compression efficiency."
FadeDetection.Tooltip="Instructs encoder whether internal fade detection algorithm should be used for calculation of weigh/offset values"
Trellis.Tooltip="Controls trellis quantization in the encoder."
LookaheadDepth.Tooltip="Specifies the depth of the look ahead rate control algorithm. The depth value is the number of frames that the encoder analyzes before encoding. Values are in the 1 to 100 range, inclusive."
MVOverpicBoundaries.Tooltip="When set to OFF, no sample outside the picture boundaries and no sample at a fractional sample position for which the sample value is derived using one or more samples outside the picture boundaries is used for inter prediction of any sample.\nWhen set to ON, one or more samples outside picture boundaries may be used in inter prediction."
PreferredMode="Repartition Check Enable"
PreferredMode.Tooltip="Controls AVC encoder attempts to predict from small partitions."
UseRawRef.Tooltip="Set this flag to ON to use raw frames for reference instead of reconstructed frames."
MVCostScalingFactor.Tooltip="0: Set MV cost to be 0.\n1: Scale MV cost to be 1/2 of the default value.\n2: Scale MV cost to be 1/4 of the default value.\n3: Scale MV cost to be 1/8 of the default value."
RDO.Tooltip="Rate distortion optimize"
AsyncDepth.Tooltip="Specifies how many asynchronous operations an application performs before the application explicitly synchronizes the result."
Latency.Tooltip="There is trade-off between latency and quality.\nIf your case prefers on quality, please select 'normal' mode, which may get > 2s end-to-end latency.\nIf your case requires < 500ms end-to-end latency, please select 'ultra-low' mode."
EncTools.Tooltip="Includes additional frame processing steps using the advanced encoder functionality to improve quality. Enctools uses CPU power to process the frame. Enabling it may affect the performance and stability of the encoder"
TuneQuality.Tooltip="Parameter specifies type of quality optimization used by the encoder"
HEVCGPB.Tooltip="Set this parameter to OFF to make HEVC encoder use regular P-frames instead of GPB."
BFramesDesc="Number of B-frames between I- or P (or GPB) key frames; if it is zero, the GOP structure is unspecified. GPB is ON, GPB frames (B without backward references) are used instead of P."
HRDConformanceDesc="If this parameter is turned ON, then encoder produces an HRD conformant bitstream. If it is turned OFF, then the encoder may (but not necessarily) violate HRD conformance."
MBBRCDesc="Setting this parameter enables macroblock level bitrate control that generally improves subjective visual quality. Enabling this flag may have negative impact on performance and objective visual quality metric."
RDODesc="Set this parameter to ON if rate distortion optimization is needed"
AdaptiveIDesc="Controls insertion of I-frames by the encoder. Set this parameter to ON to allow changing of frame type from P and B to I"
AdaptiveBDesc="Controls changing of frame type from B to P. Set this parameter to ON enable changing of frame type from B to P."
AdaptiveRefDesc="If this parameter is set to ON, encoder adaptively selects list of reference frames to improve encoding quality"
AdaptiveLTRDesc="If this parameter is set to ON, encoder will mark, modify, or remove LTR frames based on encoding parameters and content properties"
AdaptiveCQMDesc="If this parameter is set to ON, encoder adaptively selects one of implementation-defined quantization matrices for each frame. Non-default quantization matrices aim to improve subjective visual quality under certain conditions"
PyramidDesc="Enable pyramid reference structure for P and B frames. P-pyramid improves coding efficiency when B-frames are 0. B-pyramid arranges B-frames in a hierarchical reference structure."
UseRawRefDesc="Set this parameter to ON to use raw frames for reference instead of reconstructed frames"
GlobalMotionBiasDesc="Enables global motion bias"
DirectBiasDesc="Set this parameter to ON to enable the ENC mode decision algorithm to bias to fewer B Direct/Skip types. Applies only to B-frames, all other frames will ignore this setting."
MVOverpicBoundariesDesc="When set to OFF, no sample outside the picture boundaries and no sample at a fractional sample position for which the sample value is derived using one or more samples outside the picture boundaries is used for inter prediction of any sample. When set to ON, one or more samples outside picture boundaries may be used in inter prediction"
TrellisDesc="Used to control trellis quantization in encoder."
LookaheadDSDesc="Controls down sampling in look ahead bitrate control mode"
VPPDesc="Filters for additional frame processing. Enabling it can have an impact on performance"
LowPowerDesc="Hint to enable low power consumption mode for encoders. Intel Arc graphics adapters only work with the LowPower parameter enabled, changing the state of the parameter will not affect operation. The integrated Intel UHD graphics can work in both modes, the available functionality may vary depending on the state of the parameter."
IntraRefCycleSizeDesc="Specifies number of pictures within refresh cycle starting from 2. 0 and 1 are invalid values."
IntraRefQPDeltaDesc="Specifies QP difference for inserted intra MBs. Signed values are in the -51 to 51 range."
NumRefActivePDesc="How many past encoded frames P-frames can refer to when predicting the current frame. Higher values improve compression but increase GPU load, which may cause frame drops on lower-end GPUs."
NumRefActiveBL0Desc="How many past encoded frames B-frames can refer to (forward prediction). Higher values improve compression but increase GPU load, which may cause frame drops on lower-end GPUs."
NumRefActiveBL1Desc="How many future frames B-frames can refer to (backward prediction). Higher values improve compression but increase GPU load and encoding delay, which may cause frame drops on lower-end GPUs."
ScenarioInfoDesc="Specify the encoding scenario to optimize encoder settings for the intended application."
TransformSkipDesc="Enable or disable transform skip. When enabled, the encoder may skip the transform step for certain blocks to improve compression efficiency."
FadeDetectionDesc="Detect fade scenes and adjust encoding parameters. AUTO lets the encoder decide when to enable fade detection."
ContentInfoDesc="Specifies the content type to optimize encoder settings for the specific video content. Proper content type selection can improve compression efficiency."
GPUNumberDesc="Choosing a graphics adapter for multi-GPU systems. The number of the adapter you need may vary depending on the priority set by the system"

# Screen Content Tools
ScreenContentTools="Screen Content Tools"
ScreenContentTools.Tooltip="Optimizes encoding for screen content (text, UI elements, scrolling). 'Auto' enables only on supported hardware (Lunar Lake+)."
AUTO_OFF_ON="Auto / Off / On"

# Temporal Layers
TemporalLayers="Temporal Layers"
TemporalLayers.Tooltip="Number of temporal layers (0=OFF, 1-8). Temporal layers enable scalable video coding by creating a layered frame hierarchy. Higher layers can be dropped to reduce bitrate without decoder reset."
TemporalLayers.Desc="Number of temporal layers for hierarchical B-frame structure. 0 disables temporal layering."

# Separate I/P/B QP
SeparateIPBQP="Separate I/P/B QP"
SeparateIPBQPDesc="When enabled, allows setting different quantization parameters (QP) for I, P, and B frames independently. Provides finer control over quality distribution across different frame types."
CQP="CQP"
CQPDesc="Quantization parameter for all frame types when Separate I/P/B QP is disabled. Lower values produce higher quality but higher bitrate. Range 1-51 (AVC/HEVC) or 1-63 (AV1)."
QPI="QPI"
QPIQPPQPDesc="Quantization parameter value. Lower values produce higher quality at higher bitrate. Range 1-51 (AVC/HEVC) or 1-63 (AV1)."
QPP="QPP"
QPB="QPB"

