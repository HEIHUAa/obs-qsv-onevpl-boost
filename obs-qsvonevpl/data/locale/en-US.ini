# Debug group
QPStatistics="QP Statistics"
QPStatistics.Tooltip="Output per-frame QP statistics (min/max/avg/median per I/P/B frame type) to the OBS log when recording stops.\nPurely diagnostic — does not affect encoding or GPU/CPU usage."
VideoHeaderHexDump="Video Header Hex Dump"
VideoHeaderHexDump.Tooltip="Dump SPS/PPS/VPS raw bytes (hex) to the OBS log at encoder initialization.\nUseful for debugging bitstream header issues. Purely diagnostic — does not affect encoding or GPU/CPU usage."

MinQP="Min QP"
MinQPDesc="Minimum quantization parameter constraint.\nFormat: \"-1\" (driver default), \"12\" (same for all types), \"12,12,12\" (I,P,B separately).\nPrevents QP from dropping below the specified value, capping maximum quality.\nValues auto-clamped to valid range. Does not affect GPU usage."
MaxQP="Max QP"
MaxQPDesc="Maximum quantization parameter constraint. Same format as Min QP.\nPrevents QP from exceeding the specified value, capping minimum quality.\nUseful for ensuring a baseline quality level. Does not affect GPU usage."

# ROI (Region of Interest)
ROIEditor="ROI Encoder Settings"
ROIEditorDesc="Configure Region of Interest (ROI) encoding to assign different bitrate priorities to different areas of the video frame.\nROI is supported for H.264 and HEVC encoders only.\nDoes not affect GPU/CPU usage directly; encoder adjusts QP per region based on priority."
